/* ============================================================
   In-app YouTube player (IFrame API) + auto-next + expand
   ============================================================ */

var YTP = {
  player: null, apiReady: false, apiLoading: false, apiFailed: false,
  pending: null, videoId: null, timer: null, count: 0, overlayOn: false,
  countedId: null, audioObjUrl: null, startSec: 0, audioMode: false
};

function currentPlayerList() {
  if (App.player && App.player.list && App.player.list.length) return App.player.list;
  return libSongs().map(function (s) { return s.id; });
}

function playSong(id, list, startSec) {
  var s = songById(id);
  if (!s) { toast('영상을 찾을 수 없어요'); return; }
  var ch = channelOf(id);
  if (modeOf() === 'kid' && ch && isDailyLimitReached(ch)) {
    openModal('🌙 오늘은 여기까지!',
      '<div style="text-align:center;padding:12px 0"><div style="font-size:48px;margin-bottom:8px">🌙</div>' +
      '<b style="font-size:17px;display:block;margin-bottom:6px">' + esc(ch.name) + ' 오늘 목표(' + ch.dailyLimit + '편)를 다 봤어요!</b>' +
      '<p class="tiny muted">내일 또 만나요. 다른 놀이도 해 볼까요?</p></div>',
      '<button class="btn primary" data-act="close-modal">알겠어요</button>');
    return;
  }
  if (!s.vid && !s.hasAudio && !s.audioUrl) { openSong(id); return; }
  stopSpeak();
  var sec = (startSec !== undefined && startSec !== null) ? Number(startSec) : firstMatchingPartSec(s, App.lib.subject, App.lib.sub);
  App.player = {
    id: id,
    list: (list && list.length) ? list.slice() : libSongs().map(function (x) { return x.id; }),
    startSec: sec || 0,
    repeat: (App.player && App.player.repeat) ? App.player.repeat : (ch && ch.repeatMode ? ch.repeatMode : 'next'),
    audioMode: !s.vid && !!(s.hasAudio || s.audioUrl)
  };
  YTP.countedId = null;
  if (App.player.list.indexOf(id) < 0) App.player.list.unshift(id);
  App.quiz = null;
  App.view = 'player';
  try { history.replaceState(null, '', '#player'); } catch (e) { }
  render();
  window.scrollTo({ top: 0 });
}

function markPlayedOnce(id) {
  if (!id || YTP.countedId === id) return;
  YTP.countedId = id;
  recordPlay(id);
  var el = document.getElementById('player-playcount');
  if (el) el.textContent = '▶ ' + playCountOf(id) + '회 재생';
}

function playerRepeatMode() {
  if (App.player && App.player.repeat) return App.player.repeat;
  var ch = App.player ? channelOf(App.player.id) : null;
  return (ch && ch.repeatMode) || 'next';
}

function nextInList() {
  var p = App.player;
  if (!p) return null;
  var list = p.list.filter(function (id) { return !!songById(id); });
  var ix = list.indexOf(p.id);
  for (var i = ix + 1; i < list.length; i++) if (list[i] !== p.id) return list[i];
  if (playerRepeatMode() === 'loop-all') {
    for (var j = 0; j < ix; j++) if (list[j] !== p.id) return list[j];
    return p.id;
  }
  return null;
}

function viewPlayer() {

    (s.extraTopics || []).map(function (t) { return '<span class="pill ' + subjCls(t.subject) + '">' + esc(t.subject) + ' · ' + esc(t.subtopic) + '</span>'; }).join('') +
    infoBits + '</div></div></div>' +

    '<div class="player-wrap" id="player-wrap">' +
    '<div class="player-frame" id="player-frame">' +
    (App.player.audioMode ? '<div class="audio-player-box" id="audio-player-box"><div class="ap-emo">' + coverEmoji(s) + '</div><b>' + esc(cleanTitle(s.title)) + '</b><audio id="audio-player" controls style="width:100%;max-width:440px;margin-top:12px"></audio><div class="tiny muted" id="audio-status" style="margin-top:6px">음원 불러오는 중...</div></div>'
                          : '<div id="yt-player"></div>') +
    '</div>' +
    '<div class="player-bar">' +
    '<button class="btn sm sky" data-act="player-expand">⛶ 확대해서 보기</button>' +

    (hasAudio && s.vid ? '<button class="btn sm mint" data-act="player-toggle-audio">' + (App.player.audioMode ? '🎬 영상으로 보기' : '🎧 음원으로 듣기') + '</button>' : '') +
    (s.url ? '<a class="btn sm ghost" data-act="count-external" data-id="' + s.id + '" href="' + esc(s.url) + '" target="_blank" rel="noopener">유튜브에서 열기</a>' : '') +
    (nxs ? '<button class="btn sm ghost" data-act="player-next">다음 ▶</button>' : '') +
    '</div>' +
    '<div class="next-overlay" id="next-overlay">' +
    '<div class="nx-card">' +
    '<div class="nx-emoji">🎬</div>' +
    '<b class="nx-title">다음 영상이 곧 시작돼요</b>' +

        return '<a class="btn sm sun" href="' + esc(p.url) + '" target="_blank" rel="noopener" style="margin:0 6px 6px 0">📄 ' + esc(p.label) + '</a>';
      }).join('') + '</div>' : '') +

  /* next up */

  html += '</div></div>';
  return html;
}

/* ---------- YouTube IFrame API ---------- */
function loadYTAPI() {
  if (window.YT && window.YT.Player) { YTP.apiReady = true; return; }
  if (YTP.apiLoading || YTP.apiFailed) return;
  YTP.apiLoading = true;
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { YTP.apiFailed = true; showPlayerFallback('인터넷 연결을 확인해 주세요'); };
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function () {
    YTP.apiReady = true;
    YTP.apiLoading = false;
    if (YTP.pending) { var v = YTP.pending; YTP.pending = null; mountPlayer(v); }
  };
  setTimeout(function () {
    if (!YTP.apiReady && !YTP.player) {
      YTP.apiFailed = true;
      showPlayerFallback('영상 재생기를 불러오지 못했어요');
    }
  }, 6000);
}

function mountPlayer(vid) {
  var host = document.getElementById('yt-player');
  if (!host || !vid) return;
  if (!(window.YT && window.YT.Player)) {
    loadYTAPI();
    YTP.pending = vid;
    return;
  }
  try {
    if (YTP.player && YTP.player.destroy) { try { YTP.player.destroy(); } catch (e) { } }
    YTP.player = new window.YT.Player('yt-player', {
      videoId: vid,
      width: '100%',
      height: '100%',
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, start: (App.player && App.player.startSec) ? Math.floor(App.player.startSec) : undefined, origin: location.origin === 'null' ? undefined : location.origin },
      events: {
        onReady: function (e) {
          YTP.videoId = vid;
          clearTimeout(YTP.watch);
          clearInterval(YTP.poll);
          try { e.target.playVideo(); } catch (err) { }
        },
        onStateChange: onYTState,
        onError: function (e) {
          var code = e && e.data;
          if (code === 101 || code === 150) showPlayerFallback('올린 사람이 앱 안 재생을 막아 둔 영상이에요');
          else if (code === 100) showPlayerFallback('비공개이거나 삭제된 영상이에요');
          else showPlayerFallback('이 기기에서는 앱 안 재생이 어려워요');
        }
      }
    });
    watchPlayerStart();
  } catch (e) {
    showPlayerFallback('영상 재생기를 시작하지 못했어요');
  }
}

/* 재생이 시작되지 않으면(로컬 파일·차단) 안내 카드로 바꾼다 */
function watchPlayerStart() {
  YTP.started = false;
  clearTimeout(YTP.watch);
  clearInterval(YTP.poll);
  var tries = 0;
  YTP.poll = setInterval(function () {
    tries++;
    var alive = false;
    try {
      alive = !!(YTP.player && YTP.player.getDuration && YTP.player.getDuration() > 0);
      if (YTP.player && YTP.player.getPlayerState && YTP.player.getPlayerState() >= 1) alive = true;
    } catch (e) { alive = false; }
    if (YTP.started || alive) { clearInterval(YTP.poll); return; }
    if (tries >= 6) {
      clearInterval(YTP.poll);
      showPlayerFallback('여기서는 영상이 열리지 않아요. 유튜브에서 볼 수 있어요.');
    }
  }, 1500);
}

function onYTState(e) {
  if (!window.YT) return;
  clearTimeout(YTP.watch);
  clearInterval(YTP.poll);
  YTP.started = true;
  if (e.data === window.YT.PlayerState.PLAYING && App.player) {
    markPlayedOnce(App.player.id);
  }
  if (e.data === window.YT.PlayerState.ENDED) {
    onVideoEnded();
  }
}

function seekPlayer(sec) {
  sec = Math.max(0, Number(sec || 0));
  var au = document.getElementById('audio-player');
  if (au) {
    au.currentTime = sec;
    try { au.play(); } catch (e) { }
    toast(fmtSec(sec) + ' 구간으로 이동했어요');
    return;
  }
  if (YTP.player && YTP.player.seekTo) {
    try {
      YTP.player.seekTo(sec, true);
      YTP.player.playVideo();
      toast(fmtSec(sec) + ' 구간으로 이동했어요');
    } catch (e) { }
  }
}

function showPlayerFallback(msg) {
  var wrap = document.querySelector('.player-frame');
  if (!wrap) return;
  if (wrap.querySelector('.player-fallback')) return;
  var s = songById(App.player && App.player.id);
  var thumb = (s && s.vid) ? 'https://i.ytimg.com/vi/' + s.vid + '/hqdefault.jpg' : '';
  wrap.innerHTML = '<div class="player-fallback" style="' + (thumb ? "background-image:linear-gradient(rgba(30,22,18,.72),rgba(30,22,18,.86)),url('" + thumb + "');background-size:cover;background-position:center;" : '') + '">' +
    '<div class="pf-badge">🎬</div>' +
    '<b>' + esc(msg || '여기서는 영상을 재생할 수 없어요') + '</b>' +
    '<p class="tiny pf-msg">앱 안 재생이 막힌 경우예요.<br>유튜브에서 바로 볼 수 있고,<br>가사와 낱말은 아래에서 그대로 이어져요.</p>' +
    (s ? '<a class="btn primary big" href="' + esc(s.url) + '" target="_blank" rel="noopener">▶ 유튜브에서 보기</a>' : '') +
    (nextInList() ? '<button class="btn ghost sm" data-act="player-next" style="margin-top:6px;color:#fff;border-color:#8A7568">다음 영상 ▶</button>' : '') +
    '<div class="tiny pf-hint">‘다음 ▶’ 으로 다음 영상도 이어서 볼 수 있어요</div>' +
    '</div>';
}

function onVideoEnded() {
  var curCh = App.player ? channelOf(App.player.id) : null;
  if (modeOf() === 'kid' && curCh && isDailyLimitReached(curCh)) {
    var ov0 = document.getElementById('next-overlay');
    if (ov0) {
      var tt = ov0.querySelector('.nx-title'); if (tt) tt.textContent = '🌙 오늘은 여기까지!';
      var sub = ov0.querySelector('.nx-sub'); if (sub) sub.textContent = '오늘 볼 편수(' + curCh.dailyLimit + '편)를 다 봤어요';
      var nc = document.getElementById('nx-count'); if (nc) nc.textContent = '🌙';
      var btns0 = ov0.querySelector('.nx-btns');
      if (btns0) btns0.innerHTML = '<button class="btn primary" data-act="player-close">목록으로</button>';
      ov0.classList.add('on');
    }
    return;
  }
  if (playerRepeatMode() === 'loop-one') {
    YTP.countedId = null;
    var au = document.getElementById('audio-player');
    if (au) { au.currentTime = 0; try { au.play(); } catch (e) { } return; }
    if (YTP.player && YTP.player.seekTo) { try { YTP.player.seekTo(0, true); YTP.player.playVideo(); return; } catch (e) { } }
  }
  var curSong = App.player ? songById(App.player.id) : null;
  var nx = nextInList();
  var ov = document.getElementById('next-overlay');
  if (!ov) return;
  var ns = nx ? songById(nx) : null;
  if (curSong && isBookItem(curSong)) {
    showBookEndQuiz(ov, curSong, ns);
    return;
  }
  /* next title */
  var t = ov.querySelector('.nx-next');
  if (t) t.textContent = ns ? cleanTitle(ns.title) : '마지막 영상이에요';
  var btns = ov.querySelector('.nx-btns');
  if (btns) {
    btns.innerHTML = '<button class="btn ghost" data-act="player-stop">그만보기</button>' +
      (ns ? '<button class="btn primary" data-act="player-next">다음 영상 바로 보기</button>'
          : '<button class="btn primary" data-act="player-close">목록으로</button>');
  }
  ov.classList.add('on');
  YTP.overlayOn = true;
  if (!ns) return;
  YTP.count = 3;
  var el = document.getElementById('nx-count');
  if (el) el.textContent = '3';
  clearInterval(YTP.timer);
  YTP.timer = setInterval(function () {
    YTP.count--;
    var c = document.getElementById('nx-count');
    if (c) c.textContent = String(Math.max(0, YTP.count));
    if (YTP.count <= 0) {
      clearInterval(YTP.timer);
      YTP.timer = null;
      playNext();
    }
  }, 1000);
}

function showBookEndQuiz(ov, curSong, ns) {
  var pool = (typeof songWords === 'function' ? songWords(curSong) : []) || [];
  var allPool = (S.words || []).slice();
  if (!pool.length && curSong.kw && curSong.kw.length) {
    pool = curSong.kw.map(function (k) { return { w: k, k: k, e: '📖' }; });
  }
  var qPool = pool.slice();
  allPool.forEach(function (x) {
    if (qPool.length < 10 && x && !qPool.some(function (p) { return p.w.toLowerCase() === x.w.toLowerCase(); })) {
      qPool.push(x);
    }
  });
  qPool.sort(function () { return Math.random() - 0.5; });
  var questions = qPool.slice(0, Math.min(10, qPool.length));
  var qi = 0;
  var score = 0;

  var btns = ov.querySelector('.nx-btns');
  if (btns) {
    btns.innerHTML = '<button class="btn ghost" data-act="player-close">⏹️ 그만하기</button>' +
      (ns ? '<button class="btn primary" data-act="player-next">▶ 다음 영상으로</button>' : '');
  }
  ov.classList.add('on');
  YTP.overlayOn = true;
  clearInterval(YTP.timer); YTP.timer = null;

  function renderQ() {
    var tt = ov.querySelector('.nx-title');
    var sub = ov.querySelector('.nx-sub');
    var nc = document.getElementById('nx-count');
    var nxn = ov.querySelector('.nx-next');
    if (qi >= questions.length) {
      if (tt) tt.textContent = '🎉 책 퀴즈 완료!';
      if (sub) sub.textContent = short(curSong.title, 28);
      if (nc) nc.textContent = '🏆';
      if (nxn) {
        nxn.innerHTML = '<div style="padding:10px 0;font-size:16px"><b>' + questions.length + '문제 중 ' + score + '개 맞혔어요! ⭐</b></div>';
      }
      return;
    }
    var target = questions[qi];
    var opts = [target];
    var cand = qPool.concat(allPool).filter(function (x) { return x && x.w && x.w.toLowerCase() !== target.w.toLowerCase(); });
    while (opts.length < 3 && cand.length) {
      var idx = Math.floor(Math.random() * cand.length);
      var pick = cand.splice(idx, 1)[0];
      if (!opts.some(function (o) { return o.w.toLowerCase() === pick.w.toLowerCase(); })) opts.push(pick);
    }
    opts.sort(function () { return Math.random() - 0.5; });

    if (tt) tt.textContent = '📖 책 퀴즈 (' + (qi + 1) + ' / ' + questions.length + ')';
    if (sub) sub.textContent = short(curSong.title, 28);
    if (nc) nc.textContent = String(qi + 1);
    if (nxn) {
      nxn.innerHTML =
        '<div style="margin:6px 0 8px;font-size:15px"><b>' + esc(target.w) + '</b>' +
        (target.k && target.k !== target.w ? ' <span style="opacity:.8">(' + esc(target.k) + ')</span>' : '') +
        ' <button type="button" class="btn xs sky" id="bq-say" style="margin-left:6px">🔊 듣기</button></div>' +
        '<div id="bq-opts" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
        opts.map(function (o) {
          return '<button type="button" class="btn sm ghost bq-opt" data-w="' + esc(o.w) + '">' + (o.e || '📖') + ' ' + esc(o.w) + '</button>';
        }).join('') +
        '</div><div id="bq-msg" style="margin-top:8px;font-size:13px;font-weight:700;min-height:18px"></div>';
    }
    var sayBtn = document.getElementById('bq-say');
    if (sayBtn) sayBtn.onclick = function () { speak(target.w, 'en-US'); };
    try { speak(target.w, 'en-US'); } catch (e) { }

    ov.querySelectorAll('.bq-opt').forEach(function (b) {
      b.onclick = function () {
        var msg = document.getElementById('bq-msg');
        if (b.getAttribute('data-w') === target.w) {
          b.classList.remove('ghost'); b.classList.add('mint');
          score++;
          if (msg) msg.innerHTML = '🎉 맞았어요! 별 +1 ⭐';
          if (typeof addStars === 'function') addStars(1);
          setTimeout(function () { qi++; renderQ(); }, 700);
        } else {
          if (msg) msg.innerHTML = '다시 한번 골라 볼까요?';
        }
      };
    });
  }
  renderQ();
}

function stopAutoNext() {

  var ov = document.getElementById('next-overlay');
  if (ov) ov.classList.remove('on');
  YTP.overlayOn = false;
}

function playNext() {

function closePlayer() {

function mountAudioPlayer(s) {
  var au = document.getElementById('audio-player');
  var st = document.getElementById('audio-status');
  if (!au || !s) return;
  if (YTP.audioObjUrl) { try { URL.revokeObjectURL(YTP.audioObjUrl); } catch (e) { } YTP.audioObjUrl = null; }
  function wire(src, label) {
    au.src = src;
    if (st) st.textContent = label || '준비됐어요';
    if (App.player && App.player.startSec) {
      au.addEventListener('loadedmetadata', function () { au.currentTime = App.player.startSec; }, { once: true });
    }
    au.onplay = function () { if (App.player) markPlayedOnce(App.player.id); };
    au.onended = function () { onVideoEnded(); };
    try { au.play(); } catch (e) { }
  }
  if (s.hasAudio) {
    AudioDB.get(s.id, function (err, rec) {
      if (rec && rec.blob) {
        YTP.audioObjUrl = URL.createObjectURL(rec.blob);
        wire(YTP.audioObjUrl, '🎧 ' + (rec.name || '연결된 음원'));
      } else if (s.audioUrl) {
        wire(s.audioUrl, '🎧 웹 음원 연결됨');
      } else if (st) {
        st.textContent = '이 기기에서 음원 파일을 다시 선택해 주세요';
      }
    });
  } else if (s.audioUrl) {
    wire(s.audioUrl, '🎧 웹 음원 연결됨');
  }
}

function mountPlayerIfNeeded() {
  if (App.view !== 'player' || !App.player) return;
  var s = songById(App.player.id);
  if (!s) return;
  if (App.player.audioMode) { mountAudioPlayer(s); return; }
  if (YTP.apiFailed) { showPlayerFallback('영상 재생기를 불러오지 못했어요'); return; }
  mountPlayer(s.vid || '');
}

/* ---------- 인쇄 ---------- */
function printCards(title, cards, twoSided) {
  var area = document.getElementById('print-area');
  if (!area) return;
  var chunks = [];
  for (var i = 0; i < cards.length; i += 12) chunks.push(cards.slice(i, i + 12));
  var html = '<h1>' + esc(title) + '</h1><p class="pp-sub">' + esc(S.childName) + ' 학습 놀이터 · 12장/A4 · 잘라서 링으로 묶어 주세요' +
    (twoSided ? ' · 앞뒤 인쇄(양면)' : '') + '</p>';

  function frontCard(c) {
    return '<div class="sight-card">' +
      '<span class="sc-ring"></span><span class="sc-ring sc2"></span>' +
      (c.img ? '<img class="sc-img" src="' + c.img + '" alt="">' : (c.em ? '<div class="sc-em">' + c.em + '</div>' : '')) +
      '<div class="sc-word">' + esc(c.word) + '</div>' +
      (!twoSided && c.ko ? '<div class="sc-ko">' + esc(c.ko) + '</div>' : '') +
      '</div>';
  }
  function backCard(c) {
    return '<div class="sight-card back">' +
      '<span class="sc-ring"></span><span class="sc-ring sc2"></span>' +
      '<div class="sc-word small">' + esc(c.word) + '</div>' +
      '<div class="sc-ko">' + esc(c.ko || '') + '</div>' +
      '<div class="sc-pos-band ' + posCat(posOfWord(c.word)).color + '"></div>' +
      '<div class="sc-qa"><b>Q</b> ' + esc(c.q || '') + '</div>' +
      '<div class="sc-qa"><b>A</b> ' + esc(c.a || '') + '</div>' +
      (c.verb ? '<div class="sc-verb">' + esc(c.verb.text) + (c.verb.irregular ? ' *' : '') + '</div>' : '') +
      (c.tip ? '<div class="sc-tip">' + esc(c.tip) + '</div>' : '') +
      '</div>';
  }
  function grid(list, fn) {
    return '<div class="sight-grid">' + list.map(fn).join('') + '</div>';
  }
  chunks.forEach(function (ch) {
    html += '<div class="sight-page">' + grid(ch, frontCard) + '</div>';
    if (twoSided) {
      // 뒷면은 좌우를 뒤집어 인쇄해야 양면 인쇄 시 앞뒤가 맞아요
      var mirrored = [];
      for (var r = 0; r < ch.length; r += 3) {
        var row = ch.slice(r, r + 3).reverse();
        mirrored = mirrored.concat(row);
      }
      while (mirrored.length < 12) mirrored.push(null);
      html += '<div class="sight-page">' + '<div class="sight-grid">' + mirrored.map(function (c) {
        return c ? backCard(c) : '<div class="sight-card empty"></div>';
      }).join('') + '</div></div>';
    }
  });
  area.innerHTML = html;
  setTimeout(function () { window.print(); }, 120);
}

function printSight(allStages) {
  var key = (App.sight && App.sight.stage) || 'prek';
  var sets = allStages ? DOLCH : DOLCH.filter(function (d) { return d.key === key; });
  var title = allStages ? 'Dolch Sight Words 전체' : 'Sight Words · ' + sets[0].name;
  var cards = [];
  sets.forEach(function (s) {
    s.words.forEach(function (w) {
      var info = cardInfo(w);
      cards.push({ word: w, ko: info.ko, q: info.q, a: info.a, pos: info.pos, tip: info.tip, verb: info.verb });
    });
  });
  printCards(title, cards, !!(App.sight && App.sight.twoSided));
}

function printTheme() {
  var key = (App.sight && App.sight.theme) || 't34';
  var set = THEME_SETS.filter(function (t) { return t.key === key; })[0] || THEME_SETS[0];
  var cards = [];
  set.groups.forEach(function (g) {
    g.words.forEach(function (w) {
      var d = DICT[w] || { e: '📖', ko: '' };
      var info = cardInfo(w);
      cards.push({ word: w, em: d.e, ko: d.ko || info.ko, q: info.q, a: info.a, tip: info.tip, verb: info.verb });
    });
  });
  printCards(set.name + ' 단어카드', cards, !!(App.sight && App.sight.twoSided));
}

function tipOfWord(w) {
  var k = String(w || '').toLowerCase().trim();
  if (TIPS[k]) return TIPS[k];
  if (k.indexOf('a / an') === 0) return TIPS['a / an'];
  return '';
}

function cardInfo(w) {
  var pos = posOfWord(w);
  var qa = qaOfWord(w);
  var vf = (pos === 'verb') ? verbForms(w) : null;
  return { word: w, pos: pos, ko: koOfWord(w), q: qa.q, a: qa.a, tip: tipOfWord(w), verb: vf };
}

function findPlanItem(id) {
  var found = null;
  DAYKEYS.forEach(function (dk) {
    (S.plan[dk] || []).forEach(function (it) { if (it.id === id) found = { dk: dk, item: it }; });
  });
  return found;
}

function planItemOpen(id) {
  var f = findPlanItem(id);
  if (!f) return;
  var it = f.item;
  if (it.type === 'song' || it.type === 'book') {
    openSong(it.ref);
  } else if (it.type === 'step') {
    var st = stepById(it.ref);
    if (!st) return;
    App.learn.subject = it.ref.indexOf('en') === 0 ? 'en' : it.ref.indexOf('ma') === 0 ? 'ma' : 'ko';
    App.learn.step = st.n;
    App.quiz = null;
    go('learn');
  } else if (it.type === 'nuri') {
    App.learn.subject = 'nu';
    go('learn');
  } else if (it.type === 'expr') {
    speak(it.text || it.title, 'en-US');
    toast('표현을 들려줘요 🔊');
  } else if (it.type === 'review') {
    go('review');
  }
}

function togglePlanDone(id, fromHome) {
  if (!S.done) S.done = {};
  if (S.done[id]) {
    delete S.done[id];
  } else {
    S.done[id] = Date.now();
    addStar(1, '계획 완료');
    chime(true);
    confetti(12);
    toast('완료! ⭐ 스티커를 하나 받았어요');
    celebrate('완료! 멋져요!');
  }
  save();
  render();
}

/* ---------- backup ---------- */
function exportData() {
  var payload = { app: 'hangyeol-learning', v: APP_VERSION, exportedAt: new Date().toISOString(), state: S };
  var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var stamp = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  a.href = url;
  a.download = 'hangyeol-learning-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
  toast('백업 파일을 만들었어요');
}

function importFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var obj = null;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('JSON 파일을 읽을 수 없어요'); return; }
    importPayload(obj);
    input.value = '';
  };
  reader.readAsText(f, 'utf-8');
}

function importPayload(obj) {
  if (obj && obj.app === 'hangyeol-learning' && obj.state && obj.state.channels) {
    confirmBox('백업 파일을 불러오면 지금 화면의 자료가 백업 내용으로 바뀝니다. 계속할까요?', function () {
      var st = obj.state;
      S = st;
      for (var k in seedState()) if (S[k] === undefined) S[k] = seedState()[k];
      normalizeSongs(); ensureWords(); save();
      closeModal(); render(); toast('백업을 불러왔어요');
    }, '불러오기');
    return;
  }
  if (obj && obj.channels && obj.channels.length && obj.channels[0].songs) {
    mergeChannels(obj.channels);
    return;
  }
  /* ORT / 영어원서 JSON */
  var groups = [];
  function grab(list, label, sub) {
    if (Array.isArray(list) && list.length) groups.push({ list: list, label: label, sub: sub });
  }
  if (Array.isArray(obj)) grab(obj, '가져온 목록', '영어원서·그림책');
  else if (obj) {
    grab(obj.ort, 'Oxford Reading Tree (ORT)', '영어원서·ORT');
    var pb = (obj.picture_books || []).concat(obj.picture_books_ar_unregistered || []);
    grab(pb, '영어 그림책', '영어원서·그림책');
    grab(obj.books, '영어원서', '영어원서·그림책');
    grab(obj.items, '가져온 목록', '영어원서·그림책');
    grab(obj.videos, '가져온 영상', '노래·율동');
  }
  if (!groups.length) { toast('앱에서 알아볼 수 있는 JSON이 아니에요'); return; }

  var added = 0;
  groups.forEach(function (g) {
    var name = (obj.meta && obj.meta.title && g.label.indexOf('Oxford') === 0) ? g.label : g.label;
    var ch = { id: uid('ch'), name: name, memo: 'JSON에서 가져온 목록', url: '', songs: [] };
    g.list.forEach(function (it, i) {
      var title = it.title || it.name || ('항목 ' + (i + 1));
      var url = it.youtube_url || it.url || it.link || it.video_url || '';
      var kw = it.key_words || it.keywords || it.words || [];
      if (typeof kw === 'string') kw = kw.split(',').map(function (x) { return x.trim(); });
      var stage = it.stage || it.level || '';
      ch.songs.push({
        id: uid('s'), kind: 'book', n: i + 1, title: title, url: url,
        vid: (String(url).match(/v=([A-Za-z0-9_-]{11})/) || [])[1] || '',
        dur: '', subject: it.subject || '영어', subtopic: it.subtopic || g.sub || (stage ? '영어원서·ORT' : '영어원서·그림책'),
        lyrics: it.lyrics || '', source: it.youtube_channel || '', prints: [], instr: [],
        note: it.notes || it.note || it.memo || '',
        ar: (it.ar_level === null || it.ar_level === undefined) ? '' : it.ar_level,
        stage: stage, wordCount: it.word_count || it.wordCount || '',
        author: it.author || '', series: it.series || '',
        kw: kw.map(function (x) { return (typeof x === 'object') ? (x.word || x.w || '') : String(x); }).filter(Boolean),
        words: []
      });
      added++;
    });
    if (ch.songs.length) S.channels.push(ch);
  });
  normalizeSongs(); ensureWords(); save(); render();
  toast(added + '개 항목을 가져왔어요');
}

function mergeChannels(chs) {
  var n = 0;
  chs.forEach(function (c) {
    var exists = S.channels.filter(function (x) { return x.name === c.name; })[0];
    if (exists) return;
    c.id = c.id || uid('ch');
    c.songs = (c.songs || []).map(function (s) { s.id = s.id || uid('s'); return s; });
    S.channels.push(c); n += c.songs.length;
  });
  normalizeSongs(); ensureWords(); save(); render();
  toast(n ? n + '개 항목을 가져왔어요' : '이미 있는 채널이에요');
}

    '<div class="field"><label>메모</label><textarea id="ed-note" style="min-height:80px" placeholder="아이에게 어떻게 보여줄지 적어 두세요.">' + esc(s ? s.note : '') + '</textarea></div>' +

    '<div class="field"><label>추가 주제 (같은 내용 · 다른 주제)</label><div id="ed-extra-topics"></div>' +

    '<div class="field"><label>파트 나누기 (시간별 구간 · 파트별 주제)</label><div id="ed-parts"></div>' +
    '<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">' +
    '<button class="btn sm ghost" id="ed-add-part" type="button">＋ 파트 추가</button>' +
    '<button class="btn sm sky" id="ed-auto-parts" type="button">✨ 가사에서 시간 파트 추출</button></div></div>' +
    '<div class="field"><label>🎧 음원(MP3/M4A) 단독 재생 연결</label>' +
    '<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">' +
    '<input type="file" id="ed-audio-file" accept="audio/*" style="flex:1;min-width:180px">' +
    (s && s.hasAudio ? '<button class="btn sm ghost" id="ed-audio-clear" type="button">연결 해제</button>' : '') +
    '</div>' +
    '<input type="url" id="ed-audio-url" value="' + esc(s ? (s.audioUrl || '') : '') + '" placeholder="또는 음원 URL (선택)" style="margin-top:6px">' +
    '<span class="tiny muted" id="ed-audio-hint">' + (s && s.hasAudio ? '🎧 이 기기에 음원이 연결되어 있어요' : '음원 파일을 고르면 영상 없이 소리만 재생돼요') + '</span></div>';

  openModal(s ? '영상 · 책 수정' : '영상 · 책 추가', body,
    '<button class="btn ghost" data-act="close-modal">취소</button>' +
    '<button class="btn primary" id="ed-save">저장</button>' +
    (s ? '<button class="btn danger" id="ed-del">삭제</button>' : ''), true);

  /* subtopic select */
  function fillSubtopics(keep) {
    var sub = document.getElementById('ed-subject').value;
    var list = (SUBTOPICS[sub] || []).slice();
    allSongs().forEach(function (x) { if (x.subject === sub && x.subtopic && list.indexOf(x.subtopic) < 0) list.push(x.subtopic); });
    var sel = document.getElementById('ed-subtopic');
    sel.innerHTML = list.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') +
      '<option value="__custom">＋ 직접 입력</option>';
    if (keep && list.indexOf(keep) >= 0) sel.value = keep;
    else if (!keep && list.length) sel.value = list[0];
    else if (keep) sel.value = '__custom';
  }
  var subjSel = document.getElementById('ed-subject');
  subjSel.onchange = function () { fillSubtopics(''); };
  fillSubtopics(subtopic || '');
  document.getElementById('ed-subtopic').onchange = function () {
    var custom = document.getElementById('ed-subtopic-custom-wrap');
    if (this.value === '__custom') custom.classList.remove('hide'); else custom.classList.add('hide');
  };
  if (subtopic && document.getElementById('ed-subtopic').value === '__custom') {
    document.getElementById('ed-subtopic-custom-wrap').classList.remove('hide');
    document.getElementById('ed-subtopic-custom').value = subtopic;
  }

  /* prints */
  var prIdx = 0;
  function addPrintRow(label, url) {
    var wrap = document.getElementById('ed-prints');
    var row = document.createElement('div');
    row.setAttribute('data-print-row', '1');
    row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap';
    row.innerHTML = '<input type="text" class="pr-label" placeholder="이름 (예: 요일 차트)" value="' + esc(label || '') + '" style="flex:1;min-width:110px">' +
      '<input type="text" class="pr-url" placeholder="https://..." value="' + esc(url || '') + '" style="flex:2;min-width:150px">' +
      '<button type="button" class="btn sm ghost pr-x">✕</button>';
    wrap.appendChild(row);
    row.querySelector('.pr-x').onclick = function () { row.remove(); };
    prIdx++;
  }
  document.getElementById('ed-add-print').onclick = function () { addPrintRow('', ''); };
  prints.forEach(function (p) { addPrintRow(p.label, p.url); });

  /* extra topics */
  function fillSubSel(subSelEl, subjVal, keepSub) {
    var list = (SUBTOPICS[subjVal] || []).slice();
    allSongs().forEach(function (x) { if (x.subject === subjVal && x.subtopic && list.indexOf(x.subtopic) < 0) list.push(x.subtopic); });
    subSelEl.innerHTML = list.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
    if (keepSub && list.indexOf(keepSub) >= 0) subSelEl.value = keepSub;
  }
  function addTopicRow(subjVal, subVal) {
    var wrap = document.getElementById('ed-extra-topics');
    var row = document.createElement('div');
    row.setAttribute('data-topic-row', '1');
    row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap';
    row.innerHTML = '<select class="et-subj" style="flex:1;min-width:100px">' + subjectOptions(subjVal || '영어') + '</select>' +
      '<select class="et-sub" style="flex:1.4;min-width:130px"></select>' +
      '<button type="button" class="btn sm ghost et-x">✕</button>';
    wrap.appendChild(row);
    var sj = row.querySelector('.et-subj'), sb = row.querySelector('.et-sub');
    fillSubSel(sb, sj.value, subVal);
    sj.onchange = function () { fillSubSel(sb, sj.value, ''); };
    row.querySelector('.et-x').onclick = function () { row.remove(); };
  }
  document.getElementById('ed-add-topic').onclick = function () { addTopicRow('영어', ''); };
  ((s && s.extraTopics) || []).forEach(function (t) { addTopicRow(t.subject, t.subtopic); });

  /* parts */
  function addPartRow(time, title, subjVal, subVal) {
    var wrap = document.getElementById('ed-parts');
    var row = document.createElement('div');
    row.setAttribute('data-part-row', '1');
    row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center';
    row.innerHTML = '<input type="text" class="pt-time" placeholder="0:00" value="' + esc(time || '') + '" style="width:74px;flex:0 0 74px">' +
      '<input type="text" class="pt-title" placeholder="파트 제목" value="' + esc(title || '') + '" style="flex:1.5;min-width:110px">' +
      '<select class="pt-subj" style="flex:1;min-width:90px">' + subjectOptions(subjVal || subj) + '</select>' +
      '<select class="pt-sub" style="flex:1.2;min-width:110px"></select>' +
      '<button type="button" class="btn sm ghost pt-x">✕</button>';
    wrap.appendChild(row);
    var sj = row.querySelector('.pt-subj'), sb = row.querySelector('.pt-sub');
    fillSubSel(sb, sj.value, subVal);
    sj.onchange = function () { fillSubSel(sb, sj.value, ''); };
    row.querySelector('.pt-x').onclick = function () { row.remove(); };
  }
  document.getElementById('ed-add-part').onclick = function () { addPartRow('', '', document.getElementById('ed-subject').value, ''); };
  document.getElementById('ed-auto-parts').onclick = function () {
    var txt = document.getElementById('ed-lyrics').value || '';
    var found = 0;
    txt.split('\n').forEach(function (ln) {
      var m = ln.trim().match(/^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?)(?:\])?\s*[-–·]?\s*(.+)$/);
      if (m) { addPartRow(m[1], m[2].trim(), document.getElementById('ed-subject').value, ''); found++; }
    });
    toast(found ? found + '개 파트를 가사에서 가져왔어요' : '가사에 0:00 같은 시간 표시가 없어요');
  };
  ((s && s.parts) || []).forEach(function (p) { addPartRow(p.time || fmtSec(p.sec), p.title, p.subject, p.subtopic); });

  /* audio clear */
  var clearAudioFlag = false;
  var clrBtn = document.getElementById('ed-audio-clear');
  if (clrBtn) {
    clrBtn.onclick = function () {
      clearAudioFlag = true;
      var h = document.getElementById('ed-audio-hint');
      if (h) h.textContent = '저장하면 연결된 음원이 해제돼요';
    };
  }

  /* save */
  document.getElementById('ed-save').onclick = function () {
    var title = document.getElementById('ed-title').value.trim();
    if (!title) { toast('제목을 적어 주세요'); return; }
    var sub = document.getElementById('ed-subject').value;
    var subSel = document.getElementById('ed-subtopic');
    var subtopicVal = subSel.value === '__custom'
      ? (document.getElementById('ed-subtopic-custom').value.trim() || (SUBTOPICS[sub] || [])[0] || '기타')
      : subSel.value;
    var rows = [].slice.call(document.querySelectorAll('#ed-prints [data-print-row]'));
    var newPrints = rows.map(function (r) {
      return { label: r.querySelector('.pr-label').value.trim(), url: r.querySelector('.pr-url').value.trim() };
    }).filter(function (p) { return p.label || p.url; });

    var kwRaw = document.getElementById('ed-kw').value.trim();
    var kw = kwRaw ? kwRaw.split(',').map(function (x) { return x.trim(); }).filter(Boolean) : [];
    var arVal = document.getElementById('ed-ar').value.trim();

    var target = s;
    if (!target) {
      target = { id: uid('s'), kind: 'song', words: [], prints: [], instr: [], n: 0, dur: '' };
      var ch = S.channels.filter(function (c) { return c.id === chId; })[0] || S.channels[0];
      if (!ch) { ch = { id: uid('ch'), name: '내 채널', songs: [], memo: '' }; S.channels.push(ch); }
      ch.songs.push(target);
    }
    target.title = title;
    target.url = document.getElementById('ed-url').value.trim();
    var covEl = document.getElementById('ed-cover');
    target.coverUrl = covEl ? covEl.value.trim() : '';
    var vidm = String(target.url).match(/v=([A-Za-z0-9_-]{11})/);
    target.vid = vidm ? vidm[1] : (target.vid || '');
    target.subject = sub;
    target.subtopic = subtopicVal;
    target.dur = document.getElementById('ed-dur').value.trim();
    target.stage = document.getElementById('ed-stage').value.trim();
    target.ar = arVal;
    target.wordCount = document.getElementById('ed-wc').value.trim();
    target.author = document.getElementById('ed-author').value.trim();
    var lyr = document.getElementById('ed-lyrics').value;
    if (lyr !== (target.lyrics || '')) { target.lyrics = lyr; if (!kw.length) target.words = []; }
    target.note = document.getElementById('ed-note').value.trim();
    target.age = document.getElementById('ed-age').value;
    target.owned = document.getElementById('ed-owned').value === '1';
    target.picked = !!document.getElementById('ed-picked').checked;
    target.audioUrl = document.getElementById('ed-audio-url').value.trim();
    target.extraTopics = [].slice.call(document.querySelectorAll('#ed-extra-topics [data-topic-row]')).map(function (r) {
      return { subject: r.querySelector('.et-subj').value, subtopic: r.querySelector('.et-sub').value };
    });
    target.parts = [].slice.call(document.querySelectorAll('#ed-parts [data-part-row]')).map(function (r) {
      var tm = r.querySelector('.pt-time').value.trim();
      var tt = r.querySelector('.pt-title').value.trim();
      return { time: tm, sec: parseTimeSec(tm), title: tt, subject: r.querySelector('.pt-subj').value, subtopic: r.querySelector('.pt-sub').value };
    }).filter(function (p) { return p.title || p.time; });
    target.kw = kw;
    target.prints = newPrints;
    if (kw.length) target.words = kwToWords(kw);

    var audioInput = document.getElementById('ed-audio-file');
    var pickedFile = audioInput && audioInput.files && audioInput.files[0];
    if (clearAudioFlag && !pickedFile) {
      target.hasAudio = false;
      AudioDB.del(target.id);
    }
    if (pickedFile) {
      target.hasAudio = true;
      AudioDB.put(target.id, pickedFile.name, pickedFile);
    }

    normalizeSongs();
    if (!target.words || !target.words.length) {
      target.words = (target.kw && target.kw.length) ? kwToWords(target.kw) : extractWords(target.lyrics || '', target.n);
    }
    save(); closeModal(); render();
    toast(id ? '수정했어요' : '추가했어요');
  };

  if (s) {
    document.getElementById('ed-del').onclick = function () {
      confirmBox('‘' + esc(short(s.title, 26)) + '’을(를) 목록에서 지울까요? 낱말 카드와 계획 항목도 함께 정리할 수 있어요.', function () {
        S.channels.forEach(function (c) { c.songs = c.songs.filter(function (x) { return x.id !== s.id; }); });
        save(); closeModal(); render(); toast('삭제했어요');
      }, '삭제');
    };
  }
}

    '<div class="field"><label>채널 주소 (선택)</label><input type="url" id="ch-url" value="' + esc(ch ? (ch.url || '') : '') + '" placeholder="https://www.youtube.com/@..."></div>' +
    '<div class="field"><label>재생 반복 설정</label><select id="ch-repeat">' +

    '<option value="loop-one"' + (rMode === 'loop-one' ? ' selected' : '') + '>🔂 1곡 반복 재생</option>' +
    '<option value="loop-all"' + (rMode === 'loop-all' ? ' selected' : '') + '>🔁 채널 전체 반복</option>' +
    '</select></div>' +
    '<div class="field"><label><input type="checkbox" id="ch-only-selected"' + (ch && ch.onlySelected ? ' checked' : '') + '> ⭐ 아이 모드에서 고른 영상만 열기 (꺼두면 전부 열어둠)</label></div>' +
    '<div class="field"><label>⏰ 하루에 볼 영상 제한 (편까지 · 비워 두면 제한 없음)</label>' +
    '<input type="number" id="ch-daily-limit" min="0" max="99" value="' + esc(ch && ch.dailyLimit ? ch.dailyLimit : '') + '" placeholder="제한 없음"></div>' +
    (ch ? '<div class="field"><button type="button" class="btn sm ghost" id="ch-clear-plays">들은 기록 지우기 (오늘 ' + dailyPlayCount(ch.id) + '편)</button></div>' : '') +
    '<p class="hint">채널을 만들고 나면 그 안에 영상·책을 추가할 수 있어요. 영역(영어/한글/수학/다큐/기타)은 영상마다 따로 정해요.</p>';
  openModal(ch ? '채널 수정' : '채널 추가', body,
    '<button class="btn ghost" data-act="close-modal">취소</button>' +
    '<button class="btn primary" id="ch-save">저장</button>' +
    (ch ? '<button class="btn danger" id="ch-del">채널 삭제</button>' : ''));
  document.getElementById('ch-save').onclick = function () {
    var name = document.getElementById('ch-name').value.trim();
    if (!name) { toast('채널 이름을 적어 주세요'); return; }
    if (!ch) {
      ch = { id: uid('ch'), name: name, memo: document.getElementById('ch-memo').value.trim(), url: document.getElementById('ch-url').value.trim(), repeatMode: document.getElementById('ch-repeat').value, onlySelected: !!document.getElementById('ch-only-selected').checked, dailyLimit: Math.max(0, parseInt(document.getElementById('ch-daily-limit').value, 10) || 0), songs: [] };
      S.channels.push(ch);
    } else {
      ch.name = name;
      ch.memo = document.getElementById('ch-memo').value.trim();
      ch.url = document.getElementById('ch-url').value.trim();
      ch.repeatMode = document.getElementById('ch-repeat').value;
      ch.onlySelected = !!document.getElementById('ch-only-selected').checked;
      ch.dailyLimit = Math.max(0, parseInt(document.getElementById('ch-daily-limit').value, 10) || 0);
    }
    save(); closeModal(); render(); toast('저장했어요');
  };
  if (ch) {
    var cp = document.getElementById('ch-clear-plays');
    if (cp) {
      cp.onclick = function () {
        var td = todayIso();
        if (S.dailyPlays && S.dailyPlays[td]) delete S.dailyPlays[td][ch.id];
        ch.songs.forEach(function (x) { if (S.playCounts) delete S.playCounts[x.id]; });
        save();
        cp.textContent = '들은 기록 지우기 (오늘 0편)';
        toast('이 채널 들은 기록을 지웠어요');
      };
    }
    document.getElementById('ch-del').onclick = function () {
      var n = ch.songs.length;
      confirmBox('‘' + esc(ch.name) + '’ 채널과 그 안의 ' + n + '개 항목을 모두 지울까요?', function () {
        S.channels = S.channels.filter(function (c) { return c.id !== ch.id; });
        save(); closeModal(); render(); toast('채널을 삭제했어요');
      }, '삭제');
    };
  }
}

    var ko = document.getElementById('w-ko').value.trim();
    var em = document.getElementById('w-em').value.trim() || '📖';

    }

}

/* ---------- batch audio attach ---------- */
function openBatchAudioModal() {
  var body = '<p class="tiny muted" style="line-height:1.6">가지고 계신 MP3/M4A 음원 파일들을 한꺼번에 고르시면, 파일 이름의 번호(예: 01, 02)나 제목에 맞춰 채널의 곡들과 자동으로 연결해 드려요.</p>' +
    '<div class="field"><label>대상 채널</label><select id="ba-ch">' +
    S.channels.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + ' (' + c.songs.length + '곡)</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label>음원 파일 여러 개 선택</label><input type="file" id="ba-files" accept="audio/*" multiple></div>' +
    '<div id="ba-result" class="tiny muted"></div>';
  openModal('🎧 음원 일괄 연결', body,
    '<button class="btn ghost" data-act="close-modal">닫기</button>' +
    '<button class="btn primary" id="ba-run">연결하기</button>');
  document.getElementById('ba-run').onclick = function () {
    var chId = document.getElementById('ba-ch').value;
    var ch = S.channels.filter(function (c) { return c.id === chId; })[0];
    var files = document.getElementById('ba-files').files;
    if (!ch || !files || !files.length) { toast('음원 파일을 선택해 주세요'); return; }
    var matched = 0;
    [].slice.call(files).forEach(function (f) {
      var base = f.name.replace(/\.[^.]+$/, '').toLowerCase();
      var numM = base.match(/^0*(\d{1,3})[\s_.-]?/);
      var num = numM ? parseInt(numM[1], 10) : null;
      var target = null;
      if (num !== null) target = ch.songs.filter(function (s, idx) { return (s.n || idx + 1) === num; })[0];
      if (!target) {
        target = ch.songs.filter(function (s) {
          var t = cleanTitle(s.title).toLowerCase();
          return base.indexOf(t.slice(0, 10)) >= 0 || t.indexOf(base.slice(0, 10)) >= 0;
        })[0];
      }
      if (target) {
        target.hasAudio = true;
        AudioDB.put(target.id, f.name, f);
        matched++;
      }
    });
    save();
    var res = document.getElementById('ba-result');
    if (res) res.textContent = files.length + '개 중 ' + matched + '곡이 자동으로 연결됐어요!';
    toast(matched + '곡 연결 완료! 🎧');
    render();
  };
}

/* ============================================================
   이벤트 · 라우팅 · 시작
   ============================================================ */

function launchStepQuiz(subKey, n) {
  var steps = subKey === 'en' ? EN_STEPS : subKey === 'ma' ? MA_STEPS : KO_STEPS;
  var st = steps.filter(function (x) { return x.n === Number(n); })[0];
  if (!st) { toast('단계를 찾을 수 없어요'); return; }
  var qs = st.make();
  startQuiz((subKey === 'en' ? '영어' : subKey === 'ma' ? '수학' : '한글') + ' Step ' + st.n + ' · ' + st.ko,
    qs, { subKey: subKey, stepN: st.n, stepId: st.id });
}

function refreshList() {
  var l = document.getElementById('songlist');
  if (!l) return;
  l.innerHTML = modeOf() === 'kid' ? kidSongList() : songListHtml();
}

function onClick(e) {
  var btn = e.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var id = btn.getAttribute('data-id');

  try {
    switch (act) {
      case 'go': App.quiz = null; if (btn.getAttribute('data-v') === 'home') App.kidArea = null; stopSpeak(); go(btn.getAttribute('data-v')); break;
      case 'kid-tab': {
        var tk = btn.getAttribute('data-k');
        App.quiz = null; stopSpeak();
        if (tk === 'today') { App.kidArea = null; go('home'); }
        else { App.kidArea = tk; go('home'); }
        break;
      }
      case 'kid-area': App.kidArea = btn.getAttribute('data-k') || null; render(); break;
      case 'kid-lib-sub':
        App.lib.subject = btn.getAttribute('data-k') || '전체';
        App.lib.sub = '전체'; App.lib.ch = '전체'; App.lib.stage = '전체';
        go('library'); break;
      case 'kid-lib-topic': {
        var parts = (btn.getAttribute('data-k') || '전체|전체').split('|');
        App.lib.subject = parts[0] || '전체';
        App.lib.sub = parts[1] || '전체';
        App.lib.ch = '전체'; App.lib.stage = '전체';
        go('library'); break;
      }
      case 'kid-learn-sub':
        App.learn.subject = btn.getAttribute('data-k') || 'en';
        App.learn.step = 1; App.quiz = null;
        go('learn'); break;
      case 'kid-quiz-sub':
        launchStepQuiz(btn.getAttribute('data-k') || 'ma', 1); break;
      case 'lib-sub-k':
        App.lib.subject = btn.getAttribute('data-k') || '전체';
        App.lib.sub = '전체'; render(); break;
      case 'books-view-mode': App.books.viewMode = btn.getAttribute('data-k') || 'series'; App.books.ch = '전체'; App.books.stage = '전체'; App.books.roadLvl = null; App.books.roadSer = null; render(); break;
      case 'books-road-lvl': App.books.roadLvl = btn.getAttribute('data-k') || null; App.books.roadSer = null; App.books.stage = '전체'; render(); break;
      case 'books-road-ser': App.books.roadSer = btn.getAttribute('data-k') || null; App.books.stage = '전체'; render(); break;
      case 'books-road-info': openRoadSeriesModal(btn.getAttribute('data-k')); break;
      case 'books-stage': App.books.stage = btn.getAttribute('data-k') || '전체'; render(); break;
      case 'books-search-toggle':
        App.books.showSearch = !App.books.showSearch; render();
        if (App.books.showSearch) { var bq = document.getElementById('books-q'); if (bq) bq.focus(); }
        break;
      case 'toggle-ch-owned': {
        var tch = chById(id);
        if (tch) {
          var bks = tch.songs.filter(isBookItem);
          var allOn = bks.length && bks.every(function (s) { return !!s.owned; });
          bks.forEach(function (s) { s.owned = !allOn; });
          save(); closeModal(); openBookSettingsModal(); render();
        }
        break;
      }
      case 'books-age': App.books.age = btn.getAttribute('data-k') || '전체'; render(); break;
      case 'books-mom-settings': openBookSettingsModal(); break;
      case 'books-ar': App.books.ar = btn.getAttribute('data-k') || '전체'; render(); break;
      case 'books-ch': App.books.ch = btn.getAttribute('data-k') || '전체'; App.books.stage = '전체'; render(); break;
      case 'books-owned': App.books.ownedOnly = !App.books.ownedOnly; render(); break;
      case 'books-sort': App.books.sort = App.books.sort === 'AR 낮은 순' ? 'AR 높은 순' : 'AR 낮은 순'; render(); break;
      case 'books-play-all': {
        var blist = bookFiltered().map(function (p) { return p.s; }).filter(function (x) { return !!(x.vid || x.hasAudio || x.audioUrl); });
        if (!blist.length) { toast('재생할 영상·음성이 없어요'); break; }
        playSong(blist[0].id, blist.map(function (x) { return x.id; }));
        break;
      }
      case 'play': stopSpeak(); playSong(id, (App.view === 'books' ? bookFiltered().map(function (p) { return p.s; }) : libSongs()).map(function (x) { return x.id; })); break;
      case 'player-close': stopSpeak(); closePlayer(); break;
      case 'player-expand': toggleTheater(); break;
      case 'player-next': playNext(); break;
      case 'player-stop': stopAutoNext(); if (YTP.player && YTP.player.pauseVideo) { try { YTP.player.pauseVideo(); } catch (e) { } } break;
      case 'player-repeat': {
        if (!App.player) break;
        var curR = playerRepeatMode();
        var nextR = curR === 'next' ? 'loop-one' : curR === 'loop-one' ? 'loop-all' : 'next';
        App.player.repeat = nextR;
        render();
        toast(nextR === 'loop-one' ? '🔂 1곡 반복으로 켰어요' : nextR === 'loop-all' ? '🔁 전체 반복으로 켰어요' : '▶ 순서대로 재생해요');
        break;
      }
      case 'player-toggle-audio':
        if (App.player) { App.player.audioMode = !App.player.audioMode; render(); }
        break;
      case 'player-seek':
        seekPlayer(Number(btn.getAttribute('data-sec')));
        break;
      case 'play-part':
        closeModal();
        playSong(id, libSongs().map(function (x) { return x.id; }), Number(btn.getAttribute('data-sec')));
        break;
      case 'count-external':
        if (id) recordPlay(id);
        break;
      case 'lib-channel':
        App.lib.ch = btn.getAttribute('data-k'); App.lib.stage = '전체'; render(); break;
      case 'lib-agek':
        App.lib.age = btn.getAttribute('data-k');
        if (App.lib.age !== '전체' && App.lib.sort === '기본') App.lib.sort = 'AR 낮은 순';
        render(); break;
      case 'lib-owned':
        App.lib.ownedOnly = !App.lib.ownedOnly; render(); break;
      case 'own-toggle': {
        var os = songById(btn.getAttribute('data-id'));
        if (!os) break;
        os.owned = !os.owned;
        save(); render();
        if (os.owned) { chime(true); toast('🏠 집에 있어요!'); } else toast('보유 표시를 껐어요');
        break;
      }
      case 'lib-stagek':
        App.lib.stage = btn.getAttribute('data-k'); refreshList(); break;
      case 'lib-sortk':
        App.lib.sort = btn.getAttribute('data-k'); refreshList(); break;
      case 'toggle-mode': {
        var next = modeOf() === 'kid' ? 'mom' : 'kid';
        S.settings.mode = next;
        save();
        if (!navItems().some(function (v) { return v.key === App.view; })) App.view = 'home';
        App.quiz = null;
        render();
        toast(next === 'kid' ? '아이 모드 · 큰 버튼으로 놀아요' : '엄마 모드 · 정리와 계획을 볼 수 있어요');
        break;
      }
      case 'rm-track': App.rm = btn.getAttribute('data-k'); render(); break;
      case 'rm-status': {
        var sid = btn.getAttribute('data-id'), val = btn.getAttribute('data-v');
        S.roadmap = S.roadmap || {};
        S.roadmap[sid] = (S.roadmap[sid] === val) ? 'todo' : val;
        save(); render();
        if (val === 'done' && S.roadmap[sid] === 'done') { chime(true); confetti(14); toast('로드맵 단계 완료! ⭐'); addStar(1, '로드맵 완료'); }
        break;
      }
      case 'rm-note-add': openRmNote(btn.getAttribute('data-id')); break;
      case 'rm-note-del': {
        var nid = btn.getAttribute('data-id'), ni = Number(btn.getAttribute('data-i'));
        if (S.rmNotes && S.rmNotes[nid]) { S.rmNotes[nid].splice(ni, 1); save(); render(); }
        break;
      }
      case 'rm-libr': {
        App.lib.ch = btn.getAttribute('data-ch') || '전체';
        App.lib.stage = btn.getAttribute('data-stage') || '전체';
        App.lib.age = '전체'; App.lib.q = ''; App.lib.ownedOnly = false;
        go('library');
        break;
      }
      case 'rm-learn': {
        App.learn.subject = 'ko';
        App.learn.step = Number(btn.getAttribute('data-n')) || 1;
        App.quiz = null; go('learn');
        break;
      }
      case 'pecs-pick': pecsPick(Number(btn.getAttribute('data-i'))); break;
      case 'pecs-unpick': pecsUnpick(Number(btn.getAttribute('data-i'))); break;
      case 'pecs-say': pecsSpeak(); break;
      case 'pecs-complete': pecsComplete(); break;
      case 'pecs-back': pecsSentence().pop(); save(); render(); break;
      case 'pecs-clear': pecsSentence().length = 0; save(); render(); break;
      case 'pecs-new': openPecsNew(); break;
      case 'pecs-print': printPecs(); break;
      case 'open-nuri': App.learn.subject = 'nu'; App.quiz = null; go('learn'); break;
      case 'kid-random': {
        var all = libSongs();
        if (!all.length) break;
        var r = all[Math.floor(Math.random() * all.length)];
        playSong(r.id, all.map(function (x) { return x.id; }));
        break;
      }
      case 'kid-resume-ch':
        App.lib.ch = id || '전체';
        App.lib.subject = '전체'; App.lib.sub = '전체'; App.lib.stage = '전체';
        go('library');
        break;
      case 'kid-books-ch':
        App.books.ch = id || '전체';
        App.books.ar = '전체'; App.books.age = '전체';
        go('books');
        break;
      case 'kid-play-all': {
        var listA = libSongs().filter(function (x) { return !!(x.vid || x.hasAudio || x.audioUrl); });
        if (!listA.length) { toast('재생할 영상이 없어요'); break; }
        playSong(listA[0].id, listA.map(function (x) { return x.id; }));
        break;
      }
      case 'kid-shuffle-all': {
        var listS = libSongs().filter(function (x) { return !!(x.vid || x.hasAudio || x.audioUrl); }).slice();
        if (!listS.length) { toast('재생할 영상이 없어요'); break; }
        for (var si = listS.length - 1; si > 0; si--) {
          var sj = Math.floor(Math.random() * (si + 1));
          var tmp = listS[si]; listS[si] = listS[sj]; listS[sj] = tmp;
        }
        playSong(listS[0].id, listS.map(function (x) { return x.id; }));
        break;
      }
      case 'close-modal': stopSpeak(); closeModal(); break;

      /* ---- quiz ---- */
      case 'answer': answer(Number(btn.getAttribute('data-i'))); break;
      case 'say-q': speakQuestion(); break;
      case 'quiz-exit': stopSpeak(); App.quiz = null; render(); break;
      case 'quiz-again':
        var m = App.quiz && App.quiz.meta;
        App.quiz = null;
        if (m && m.review) reviewQuiz();
        else if (m && m.subKey) launchStepQuiz(m.subKey, m.stepN);
        else render();
        break;
      case 'quiz-next':
        var m2 = App.quiz && App.quiz.meta;
        App.quiz = null;
        if (m2 && m2.subKey) {
          App.learn.subject = m2.subKey === 'en' ? 'en' : m2.subKey === 'ma' ? 'ma' : 'ko';
          App.learn.step = Math.min(5, m2.stepN + 1);
        }
        render();
        break;

      /* ---- speech ---- */
      case 'say-word': speak(btn.getAttribute('data-w'), btn.getAttribute('data-lang') || 'en-US'); break;
      case 'say-text': speak(btn.getAttribute('data-t'), btn.getAttribute('data-lang') || 'en-US'); break;
      case 'say-line':
        var sid = App.openSongId || (App.player && App.player.id);
        var sgl = songById(sid);
        if (sgl) {
          var lns = String(sgl.lyrics || '').split('\n');
          var ln = lns[Number(btn.getAttribute('data-i'))] || '';
          var cleanLn = ln.replace(/^\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*/, '').trim();
          if (cleanLn) speak(cleanLn, 'en-US');
        }
        break;
      case 'speak-lyrics':
        var sl = songById(id);
        if (sl) speak(String(sl.lyrics || '').replace(/^(Verse|Chorus|Pre-Chorus|Bridge)[^\n]*$/gim, '').replace(/\s+/g, ' ').slice(0, 900), 'en-US', 0.9);
        break;
      case 'stop-speak': stopSpeak(); break;
      case 'say-song':
        var ss = reviewSong();
        if (ss) speak(ss.title, 'en-US');
        break;
      case 'say-current':
        var cur = reviewSong();
        if (cur && cur.words && cur.words[App.review.idx]) speak(cur.words[App.review.idx].w, 'en-US');
        break;

      /* ---- learn ---- */
      case 'learn-sub':
        App.learn.subject = btn.getAttribute('data-k');
        App.learn.step = 1; App.quiz = null; render(); break;
      case 'learn-step':
        App.learn.step = Number(btn.getAttribute('data-n')); App.quiz = null; render(); break;
      case 'start-quiz':
        launchStepQuiz(btn.getAttribute('data-sub'), btn.getAttribute('data-n')); break;

      /* ---- library ---- */
      case 'lib-subject':
        App.lib.subject = btn.getAttribute('data-k');
        App.lib.sub = '전체';
        App.lib.stage = '전체';
        render(); break;
      case 'lib-topic':
        App.lib.sub = btn.getAttribute('data-k'); render(); break;
      case 'lib-print':
        App.lib.onlyPrint = !App.lib.onlyPrint; render(); break;
      case 'lib-picked':
        App.lib.onlyPicked = !App.lib.onlyPicked; render(); break;
      case 'lib-more':
        App.lib.showMore = !App.lib.showMore; render(); break;
      case 'lib-search-toggle':
        App.lib.showSearch = !App.lib.showSearch; render();
        if (App.lib.showSearch) { var lq = document.getElementById('lib-q'); if (lq) lq.focus(); }
        break;
      case 'lib-pick-ch':
        App.lib.ch = id || '전체';
        App.lib.sub = '전체';
        render(); break;
      case 'pick-toggle': {
        var ps = songById(id);
        if (!ps) break;
        ps.picked = !ps.picked;
        save(); render();
        toast(ps.picked ? '⭐ 엄마가 고른 목록에 넣었어요' : '고른 목록에서 뺐어요');
        break;
      }
      case 'ch-repeat-cycle': {
        var rch = S.channels.filter(function (c) { return c.id === id; })[0];
        if (!rch) break;
        var cr = rch.repeatMode || 'next';
        rch.repeatMode = cr === 'next' ? 'loop-one' : cr === 'loop-one' ? 'loop-all' : 'next';
        save(); render();
        toast(rch.repeatMode === 'loop-one' ? '🔂 이 채널은 1곡 반복!' : rch.repeatMode === 'loop-all' ? '🔁 이 채널은 전체 반복!' : '▶ 순서대로 재생');
        break;
      }
      case 'ch-only-picked': {
        var pch = S.channels.filter(function (c) { return c.id === id; })[0];
        if (!pch) break;
        pch.onlySelected = !pch.onlySelected;
        save(); render();
        toast(pch.onlySelected ? '⭐ 아이 모드에 고른 영상만 보여요' : '아이 모드에 채널 전체가 보여요');
        break;
      }
      case 'batch-audio': openBatchAudioModal(); break;
      case 'open-song': App.openSongId = id; openSong(id); break;
      case 'open-prints': openPrints(id); break;
      case 'song-words':
        App.review.songId = id; App.review.idx = 0; App.review.mode = 'card';
        App.quiz = null; go('review'); break;
      case 'edit-song': stopSpeak(); closeModal(); openSongEditor(id); break;
      case 'del-song': {
        var ds = songById(id);
        if (!ds) break;
        confirmBox('‘' + esc(short(ds.title, 26)) + '’을(를) 지울까요?', function () {
          S.channels.forEach(function (c) { c.songs = c.songs.filter(function (x) { return x.id !== id; }); });
          save(); render(); toast('삭제했어요');
        }, '삭제');
        break;
      }
      case 'add-song':
        openSongEditor(null, btn.getAttribute('data-ch') || (S.channels[0] || {}).id, btn.getAttribute('data-subject') || (App.lib.subject === '전체' ? '영어' : App.lib.subject));
        break;
      case 'add-channel': openChannelEditor(null); break;
      case 'edit-channel': openChannelEditor(id); break;

      /* ---- review ---- */
      case 'review-tab': App.review.tab = btn.getAttribute('data-k'); render(); break;
      case 'pecs-info': openPecsInfo(Number(btn.getAttribute('data-i'))); break;
      case 'pecs-say-card': speak(btn.getAttribute('data-t'), 'en-US'); break;
      case 'word-pos': App.sight = App.sight || {}; App.sight.pos = btn.getAttribute('data-k'); render(); break;
      case 'word-flip': toggleFlip(btn.getAttribute('data-k')); break;
      case 'print-sided': App.sight = App.sight || {}; App.sight.twoSided = !App.sight.twoSided; render(); break;
      case 'sight-stage': App.sight = App.sight || {}; App.sight.stage = btn.getAttribute('data-k'); render(); break;
      case 'theme-set': App.sight = App.sight || {}; App.sight.theme = btn.getAttribute('data-k'); render(); break;
      case 'word-done': toggleWordDone(btn.getAttribute('data-k')); render(); break;
      case 'print-sight': printSight(false); break;
      case 'print-sight-all': printSight(true); break;
      case 'print-theme': printTheme(); break;
      case 'review-mode': App.review.mode = btn.getAttribute('data-m'); render(); break;
      case 'review-quiz': reviewQuiz(); break;
      case 'review-pick':
        App.review.idx = Number(btn.getAttribute('data-i'));
        App.review.mode = 'card';
        render();
        var rp = reviewSong();
        if (rp && rp.words[App.review.idx]) speak(rp.words[App.review.idx].w, 'en-US');
        break;
      case 'review-prev': App.review.idx = Math.max(0, (App.review.idx || 0) - 1); render(); break;
      case 'review-next': {
        var rn = reviewSong();
        var len = rn ? rn.words.length : 0;
        App.review.idx = (App.review.idx + 1) % Math.max(1, len);
        render();
        if (rn && rn.words[App.review.idx]) speak(rn.words[App.review.idx].w, 'en-US');
        break;
      }
      case 'word-add': openWordAdd(App.review.songId); break;
      case 'word-del': {
        var rs = reviewSong();
        var wi = Number(btn.getAttribute('data-i'));
        if (!rs) break;
        var wword = rs.words[wi];
        confirmBox('‘' + esc(wword ? wword.w : '') + '’ 낱말을 이 영상에서 뺄까요?', function () {
          rs.customDel = true;
          rs.words.splice(wi, 1);
          save(); render(); toast('낱말을 뺐어요');
        }, '빼기');
        break;
      }

      /* ---- plan ---- */
      case 'plan-done': togglePlanDone(id); break;
      case 'plan-del': {
        DAYKEYS.forEach(function (dk) {
          S.plan[dk] = (S.plan[dk] || []).filter(function (it) { return it.id !== id; });
        });
        if (S.done) delete S.done[id];
        save(); render(); toast('계획에서 뺐어요');
        break;
      }
      case 'plan-add': openPlanAdd(btn.getAttribute('data-dk')); break;
      case 'plan-open': planItemOpen(id); break;
      case 'plan-reset':
        confirmBox('이번 주 계획을 기본 4세 시작 계획으로 되돌릴까요?', function () {
          S.plan = defaultPlan(); S.activeTheme = null; save(); render(); toast('기본 계획으로 되돌렸어요');
        });
        break;
      case 'plan-clear':
        confirmBox('이번 주 계획을 모두 비울까요? (완료 표시는 남아요)', function () {
          DAYKEYS.forEach(function (dk) { S.plan[dk] = []; });
          S.activeTheme = null; save(); render(); toast('비웠어요');
        });
        break;

      /* ---- themes ---- */
      case 'theme-apply': {
        var th = allThemes().filter(function (t) { return t.id === id; })[0];
        if (!th) break;
        var hasCustom = DAYKEYS.some(function (dk) {
          return (S.plan[dk] || []).some(function (it) { return it.id.indexOf('th') !== 0 && !/^th/.test(it.id); });
        });
        if (hasCustom) {
          confirmBox('지금 계획표를 ‘' + esc(th.title) + '’ 주차 계획으로 바꿀까요? 직접 넣은 항목은 지워져요.', function () {
            applyTheme(th);
          }, '적용하기');
        } else {
          applyTheme(th);
        }
        break;
      }
      case 'theme-view': closeModal(); openThemeView(id); break;
      case 'theme-del': {
        var cth = (S.customThemes || []).filter(function (t) { return t.id === id; })[0];
        if (!cth) break;
        confirmBox('‘' + esc(cth.title) + '’ 내 주제를 지울까요?', function () {
          S.customThemes = (S.customThemes || []).filter(function (t) { return t.id !== id; });
          save(); render(); toast('지웠어요');
        }, '삭제');
        break;
      }
      case 'theme-clear':
        S.activeTheme = null; save(); render(); toast('주제 적용을 해제했어요');
        break;
      case 'theme-save-custom': openSaveCustomTheme(); break;

      /* ---- settings ---- */
      case 'save-name': {
        var nm = (document.getElementById('set-name').value || '').trim();
        if (!nm) { toast('이름을 적어 주세요'); return; }
        S.childName = nm.slice(0, 20);
        save(); render(); toast('이름을 저장했어요');
        break;
      }
      case 'toggle-sound':
        S.settings.sound = !S.settings.sound; save(); render(); break;
      case 'export': exportData(); break;
      case 'reset-all': resetAll(); break;
    }
  } catch (err) {
    if (window.console) console.error(err);
    toast('잠깐 문제가 생겼어요: ' + (err && err.message ? err.message : err));
  }
}

function onChange(e) {
  var t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'import-file') { importFile(t); return; }
  if (t.id === 'lib-ch') {
    App.lib.ch = t.value;
    refreshList();
    return;
  }
  if (t.id === 'lib-age') {
    App.lib.age = t.value;
    if (App.lib.age !== '전체' && App.lib.sort === '기본') App.lib.sort = 'AR 낮은 순';
    render();
    return;
  }
  if (t.id === 'lib-stage') {
    App.lib.stage = t.value;
    refreshList();
    return;
  }
  if (t.id === 'lib-ar') {
    App.lib.ar = t.value;
    refreshList();
    return;
  }
  if (t.id === 'lib-sort') {
    App.lib.sort = t.value;
    refreshList();
    return;
  }
  if (t.id === 'lib-q') {
    App.lib.q = t.value;
    var l2 = document.getElementById('songlist');
    if (l2) l2.innerHTML = songListHtml();
    return;
  }
  if (t.id === 'review-song') {
    App.review.songId = t.value; App.review.idx = 0; App.review.mode = 'card'; render(); return;
  }
  if (t.id === 'set-rate') {
    S.settings.rate = Number(t.value); save();
    var lab = t.parentElement.querySelector('label');
    if (lab) lab.textContent = '말하기 속도 · ' + Number(S.settings.rate).toFixed(2) + '배';
    return;
  }
}

function onInput(e) {
  var t = e.target;
  if (!t) return;
  if (t.id === 'lib-q') {
    App.lib.q = t.value;
    refreshList();
  } else if (t.id === 'books-q') {
    App.books.q = t.value;
    var pos = t.selectionStart;
    render();
    var nb = document.getElementById('books-q');
    if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (err) {} }
  }
}

function onNuriCheck(e) {
  var t = e.target;
  if (!t || t.getAttribute('data-act') !== 'nuri-check') return;
  var a = t.getAttribute('data-a'), k = t.getAttribute('data-k');
  S.nuri[a] = S.nuri[a] || {};
  if (t.checked) {
    S.nuri[a][k] = true;
    addStar(1, '누리 활동 체크');
    chime(true); confetti(10);
  } else {
    delete S.nuri[a][k];
  }
  save();
  var card = t.closest('.nuricard');
  if (card) {
    var items = card.querySelectorAll('input[data-act="nuri-check"]');
    var done = 0;
    items.forEach(function (x) { if (x.checked) done++; });
    var pct = Math.round(done / items.length * 100);
    var bar = card.querySelector('.areaprog i');
    if (bar) bar.style.width = pct + '%';
    var lab = card.querySelector('.tiny.muted');
    if (lab) lab.textContent = done + ' / ' + items.length + ' 완료';
  }
  var sc = document.getElementById('star-count');
  if (sc) sc.textContent = S.stars;
}

function openSaveCustomTheme() {
  var body = '<div class="field"><label>내 주제 이름</label>' +
    '<input type="text" id="ct-title" placeholder="예: 우리 아이 겨울 주제" value=""></div>' +
    '<div class="field"><label>한 줄 목표 (선택)</label><input type="text" id="ct-goal" placeholder="이번 주에 익히고 싶은 것"></div>' +
    '<p class="hint">지금 계획표에 있는 항목이 그대로 내 주제로 저장돼요. 나중에 ‘이 주차 계획 적용하기’로 다시 불러올 수 있어요.</p>';
  openModal('지금 계획을 내 주제로 저장', body,
    '<button class="btn ghost" data-act="close-modal">취소</button>' +
    '<button class="btn primary" id="ct-save">저장</button>');
  document.getElementById('ct-save').onclick = function () {
    var title = document.getElementById('ct-title').value.trim();
    if (!title) { toast('이름을 적어 주세요'); return; }
    var days = {};
    DAYKEYS.forEach(function (dk) {
      days[dk] = (S.plan[dk] || []).map(function (it) {
        return { type: it.type, ref: it.ref, text: it.text || (it.type === 'expr' ? it.title : '') };
      });
    });
    S.customThemes = S.customThemes || [];
    S.customThemes.push({
      id: uid('ct'), n: 0, custom: true, ico: '⭐', title: title,
      goal: document.getElementById('ct-goal').value.trim() || '내가 만든 주제 계획',
      tip: '', days: days
    });
    save(); closeModal(); render(); toast('내 주제로 저장했어요');
  };
}

/* ---------- boot ---------- */
function firstRunWelcome() {
  var body = '<p style="font-size:15px;line-height:1.65">한결이를 위한 학습 놀이터를 만들었어요. 이렇게 쓰면 좋아요.</p>' +
    '<div class="tipbox" style="margin-top:10px">' +
    '<b>1. 오늘</b> — 오늘 할 일을 보고 완료! ⭐ 를 눌러 주세요.<br>' +
    '<b>2. 노래방</b> — Oliver\'s Melody Club 84곡의 가사·프린트물, ORT·그림책 79권까지 한곳에 있어요.<br>' +
    '<b>3. 단어놀이</b> — 가사와 책의 핵심 낱말로 카드·듣기 퀴즈를 해요.<br>' +
    '<b>4. 배우기</b> — 영어·수학·한글 단계별 놀이와 누리과정 체크리스트.<br>' +
    '<b>5. 계획표</b> — 영어유치원 준비 6주 주제 계획을 한 번에 적용할 수 있어요.' +
    '</div>' +
    '<p class="hint">이름·목소리·백업은 <b>설정</b>에서 바꿀 수 있어요. 모든 자료는 이 기기에만 저장돼요.</p>';
  openModal('한결 학습 놀이터에 오신 것을 환영해요 🌼', body,
    '<button class="btn primary" data-act="close-modal">시작할게요!</button>');
}

function boot() {
  load();
  var hash = (location.hash || '').replace('#', '');
  if (VIEWS.some(function (v) { return v.key === hash; })) App.view = hash;

  document.addEventListener('click', onClick, false);
  document.addEventListener('change', onChange, false);
  document.addEventListener('input', onInput, false);
  document.addEventListener('change', onNuriCheck, false);

  var ov = document.getElementById('overlay');
  if (ov) ov.addEventListener('click', function (e) { if (e.target === ov) { stopSpeak(); closeModal(); } });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (h && VIEWS.some(function (v) { return v.key === h; }) && h !== App.view) { App.view = h; render(); }
  });

  window.addEventListener('error', function (ev) {
    if (window.console) console.error('app error', ev.message);
  });

  render();

  var fresh = false;
  try { fresh = !localStorage.getItem(LS_KEY); } catch (e) { fresh = true; }
  if (fresh) setTimeout(firstRunWelcome, 500);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
