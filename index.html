<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFBF3">
<title>한결 학습 놀이터 · 누리과정 영어·수학·한글</title>
<style>
/* 한결 학습 놀이터 — styles */
:root{
  --cream:#FFFBF3;
  --cream2:#FFF4E6;
  --card:#FFFFFF;
  --ink:#40352F;
  --ink2:#7C6C62;
  --ink3:#A79690;
  --line:#F0E4D8;
  --coral:#FF8C7A;
  --coral-d:#EF6C58;
  --coral-l:#FFE7E1;
  --mint:#6FD3B4;
  --mint-d:#3FB694;
  --mint-l:#DFF7EF;
  --sky:#87C6EE;
  --sky-d:#57A9DC;
  --sky-l:#E2F2FC;
  --sun:#FFD166;
  --sun-l:#FFF3D2;
  --lav:#B9A5EF;
  --lav-l:#EDE6FD;
  --peach:#FFB495;
  --r-sm:14px; --r:20px; --r-lg:28px; --r-xl:36px;
  --sh:0 10px 30px rgba(140,105,85,.10);
  --sh-sm:0 4px 14px rgba(140,105,85,.08);
  --sh-big:0 18px 50px rgba(140,105,85,.16);
  --font:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--cream);
  background-image:
    radial-gradient(1200px 600px at 8% -10%, #FFF0DE 0%, rgba(255,240,222,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #E9F7F2 0%, rgba(233,247,242,0) 55%),
    radial-gradient(800px 600px at 50% 110%, #EAF3FC 0%, rgba(234,243,252,0) 60%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  line-height:1.5;
  min-height:100vh;
}
button{font-family:inherit; color:inherit; cursor:pointer; border:0; background:none;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink);}
a{color:var(--sky-d);}

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  display:none; width:250px; flex:0 0 250px; padding:26px 18px; position:sticky; top:0; height:100vh;
  flex-direction:column; gap:8px;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px;}
.brand .logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(145deg,var(--coral),var(--sun));display:grid;place-items:center;font-size:24px;box-shadow:var(--sh-sm);}
.brand b{font-size:17px; letter-spacing:-.3px; display:block; line-height:1.25;}
.brand span{font-size:12px; color:var(--ink3);}
.navbtn{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; font-size:15.5px; font-weight:700;
  color:var(--ink2); width:100%; text-align:left; transition:.18s;
}
.navbtn .ico{font-size:20px; width:26px; text-align:center;}
.navbtn:hover{background:#fff; color:var(--ink);}
.navbtn.on{background:#fff; color:var(--ink); box-shadow:var(--sh-sm);}
.navbtn.on .ico{transform:scale(1.08);}
.sidebar .spacer{flex:1;}
.starbox{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh-sm);font-size:14px;color:var(--ink2);}
.starbox b{font-size:22px;color:var(--coral-d);}

.main{flex:1; min-width:0; padding:16px 16px 108px;}
.topbar{display:flex; align-items:center; gap:10px; margin:4px 2px 14px;}
.topbar h1{font-size:19px; margin:0; letter-spacing:-.4px; flex:1;}
.topbar .pillstars{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:var(--sh-sm);font-size:14px;color:var(--coral-d);}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; justify-content:space-around; gap:2px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border-radius:16px; font-size:11px; font-weight:700; color:var(--ink3);}
.tabbar button .ico{font-size:21px; line-height:1.1;}
.tabbar button.on{color:var(--coral-d); background:var(--coral-l);}
@media(min-width:960px){
  .sidebar{display:flex;}
  .tabbar{display:none;}
  .main{padding:26px 34px 60px; max-width:1180px;}
  .topbar h1{font-size:23px;}
}

/* ---------- generic ---------- */
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); padding:20px;}
.card.tight{padding:14px;}
.sectitle{display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:17px; letter-spacing:-.3px;}
.sectitle .sub{font-size:12.5px; font-weight:600; color:var(--ink3); margin-left:auto;}
.muted{color:var(--ink2);}
.tiny{font-size:12.5px;}
.center{text-align:center;}
.row{display:flex; align-items:center; gap:10px;}
.wrap{flex-wrap:wrap;}
.grid{display:grid; gap:10px;}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.grid.three{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(min-width:720px){ .grid.three{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));} }
.hide{display:none !important;}
.spread{display:flex; align-items:center; justify-content:space-between; gap:10px;}
hr.sep{border:0;border-top:1px dashed var(--line); margin:16px 0;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:999px; font-weight:800; font-size:15px;
  background:#fff; color:var(--ink); box-shadow:var(--sh-sm); border:1.5px solid var(--line);
  transition:transform .12s, box-shadow .18s, background .18s;
  min-height:46px;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(145deg,var(--coral),var(--coral-d)); color:#fff; border-color:transparent; box-shadow:0 10px 22px rgba(239,108,88,.28);}
.btn.mint{background:linear-gradient(145deg,#8BE3C8,var(--mint-d)); color:#fff; border-color:transparent; box-shadow:0 10px 22px rgba(63,182,148,.25);}
.btn.sky{background:linear-gradient(145deg,#A5D8F5,var(--sky-d)); color:#fff; border-color:transparent; box-shadow:0 10px 22px rgba(87,169,220,.25);}
.btn.sun{background:linear-gradient(145deg,#FFE08A,#F5B93B); color:#7A4E1B; border-color:transparent; box-shadow:0 10px 22px rgba(245,185,59,.28);}
.btn.ghost{background:transparent; box-shadow:none; border-color:var(--line); color:var(--ink2);}
.btn.sm{padding:8px 13px; font-size:13.5px; min-height:38px;}
.btn.xs{padding:5px 10px; font-size:12px; min-height:28px; border-radius:999px;}
.btn.big{padding:18px 28px; font-size:18px; min-height:62px;}
.btn.block{width:100%;}
.btn.danger{color:#D2483A; border-color:#F7D3CD;}
.btn[disabled]{opacity:.45; pointer-events:none;}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-sm);font-size:17px;border:1.5px solid var(--line);}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; font-size:12px; font-weight:800;
  background:#fff; color:var(--ink2); border:1.5px solid var(--line); white-space:nowrap; flex-shrink:0; transition:.16s;
}
.chip:active{transform:scale(.97);}
.chip.on{background:var(--ink); color:#fff; border-color:transparent;}
.chip.on.coral{background:var(--coral); }
.chip.on.mint{background:var(--mint-d);}
.chip.on.sky{background:var(--sky-d);}
.chip.on.sun{background:#F5B93B; color:#fff;}
.chip.on.lav{background:var(--lav);}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chips.wrapchips{flex-wrap:wrap; overflow:visible;}

.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--cream2);color:var(--ink2);}
.pill.en{background:var(--sky-l); color:#2F7CA8;}
.pill.ko{background:var(--coral-l); color:#C4523F;}
.pill.math{background:var(--mint-l); color:#2A8A70;}
.pill.doc{background:var(--lav-l); color:#6B52B8;}
.pill.etc{background:var(--sun-l); color:#9A6B12;}
.pill.print{background:#F1F7E8; color:#5D7F2E;}
.pill.star{background:var(--sun-l); color:#9A6B12;}

/* ---------- home ---------- */
.hello{
  position:relative; overflow:hidden; border-radius:var(--r-xl); padding:24px 22px;
  background:linear-gradient(135deg,#FFF3E6 0%,#FFE7E1 45%,#E4F6EF 100%);
  box-shadow:var(--sh);
}
.hello h2{margin:0 0 6px; font-size:26px; letter-spacing:-.8px; line-height:1.25;}
.hello p{margin:0; color:var(--ink2); font-size:14.5px;}
.hello .deco{position:absolute; right:-6px; top:-10px; font-size:88px; opacity:.5; transform:rotate(8deg); pointer-events:none;}
.hello .row-badge{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.hello .hbadge{background:rgba(255,255,255,.8);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--ink2);}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
.stat{background:#fff;border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh-sm);}
.stat b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.5px;}
.stat span{font-size:12px;color:var(--ink3);font-weight:700;}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.tile{
  display:flex; flex-direction:column; gap:6px; align-items:flex-start; text-align:left;
  border-radius:var(--r-lg); padding:18px; background:#fff; box-shadow:var(--sh-sm); border:1.5px solid transparent;
  transition:.15s; min-height:112px;
}
.tile:active{transform:scale(.985);}
.tile .ico{font-size:30px;}
.tile b{font-size:16px; letter-spacing:-.3px;}
.tile span{font-size:12.5px; color:var(--ink2); line-height:1.35;}
.tile.c1{background:linear-gradient(150deg,#FFF0EA,#FFE3DC);}
.tile.c2{background:linear-gradient(150deg,#E9F8F2,#DDF3EC);}
.tile.c3{background:linear-gradient(150deg,#EAF4FC,#DDEDFA);}
.tile.c4{background:linear-gradient(150deg,#FFF6DF,#FFEFC8);}
@media(min-width:700px){ .tiles{grid-template-columns:repeat(4,1fr);} }

.planlist{display:flex;flex-direction:column;gap:10px;}
.planitem{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--sh-sm); border:1.5px solid transparent;
}
.planitem .kico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--cream2);flex:0 0 42px;}
.planitem .body{flex:1;min-width:0;}
.planitem b{font-size:15px;display:block;letter-spacing:-.2px;}
.planitem .meta{font-size:12px;color:var(--ink3);}
.planitem.done{background:#F7FCF4;border-color:#DFF0D2;}
.planitem.done b{color:#6C8B52; text-decoration:line-through; text-decoration-color:#B7D09B;}
.checkstar{
  width:52px;height:52px;flex:0 0 52px;border-radius:18px;background:var(--cream2);
  display:grid;place-items:center;font-size:22px;font-weight:900;color:#C7B6AC;transition:.16s;
}
.checkstar:active{transform:scale(.94);}
.checkstar.on{background:linear-gradient(145deg,#FFE08A,#F5B93B);color:#fff;box-shadow:0 8px 18px rgba(245,185,59,.35);}

.stickerboard{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
.sticker{aspect-ratio:1;border-radius:12px;background:var(--cream2);display:grid;place-items:center;font-size:clamp(12px,2.4vw,20px);}
.sticker.fill{background:linear-gradient(145deg,#FFE9A8,#FFD166);box-shadow:inset 0 -2px 0 rgba(194,141,29,.18);}

/* ---------- library ---------- */
.filters{position:sticky; top:0; z-index:20; background:rgba(255,251,243,.92); backdrop-filter:blur(10px); padding:8px 0 10px; margin:-6px 0 6px;}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 16px;box-shadow:var(--sh-sm);border:1.5px solid var(--line);}
.searchbox input{border:0;outline:0;flex:1;background:transparent;font-size:15px;}
.channelbar{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap;}
.channelbar h3{margin:0;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.channelbar .count{font-size:12.5px;color:var(--ink3);font-weight:700;}

.vcard{
  display:flex; gap:12px; align-items:flex-start; background:#fff; border-radius:var(--r);
  padding:12px 14px; box-shadow:var(--sh-sm); border:1.5px solid transparent; transition:.16s;
}
.vcard:active{transform:scale(.995);}
.vnum{
  flex:0 0 46px; width:46px; height:46px; border-radius:15px; background:var(--cream2);
  display:grid; place-items:center; font-weight:900; font-size:15px; color:var(--coral-d); letter-spacing:-.5px;
}
.vmain{flex:1; min-width:0;}
.vmain .t{font-size:14.8px; font-weight:800; letter-spacing:-.3px; line-height:1.35; word-break:keep-all; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vmain .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.vacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.vmemo{font-size:12.5px;color:var(--ink2);margin-top:6px;background:var(--cream);border-radius:10px;padding:6px 9px;}
.empty{
  border:2px dashed #EFDECB; border-radius:var(--r-lg); padding:26px 18px; text-align:center; color:var(--ink2); background:rgba(255,255,255,.55);
}
.empty .big{font-size:34px;display:block;margin-bottom:6px;}

/* ---------- lyrics / modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(70,50,45,.42); z-index:80; display:none; align-items:flex-end; justify-content:center;}
.overlay.on{display:flex;}
@media(min-width:760px){ .overlay{align-items:center;} }
.sheet{
  background:var(--cream); width:100%; max-width:720px; max-height:92vh; border-radius:var(--r-xl) var(--r-xl) 0 0;
  display:flex; flex-direction:column; box-shadow:var(--sh-big); animation:up .22s ease-out;
}
@media(min-width:760px){ .sheet{border-radius:var(--r-xl); max-height:88vh;} }
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{display:flex; align-items:center; gap:10px; padding:18px 20px 10px;}
.sheet header h3{margin:0; font-size:18px; flex:1; letter-spacing:-.4px; line-height:1.3;}
.sheet .content{padding:4px 20px 20px; overflow:auto; -webkit-overflow-scrolling:touch;}
.sheet footer{padding:12px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; background:var(--cream);}
.lyrics{font-size:17px; line-height:1.95; white-space:pre-wrap; word-break:break-word; padding:6px 2px;}
.lyrics .ln{border-radius:10px; padding:1px 6px; margin-left:-6px; cursor:pointer; transition:background .15s;}
.lyrics .ln:hover{background:#FFF0DC;}
.lyrics .sec{color:var(--coral-d); font-weight:800; font-size:13.5px; letter-spacing:.4px; margin-top:10px; white-space:pre-wrap;}
.lyrics .ln small{font-size:11px; color:var(--ink3); margin-left:6px;}

.toast{
  position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px);
  background:#3F352F; color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:700;
  opacity:0; pointer-events:none; transition:.22s; z-index:95; box-shadow:var(--sh-big); max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
@media(min-width:960px){ .toast{bottom:36px;} }

#fx{position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden;}
.confetti{position:absolute; width:12px; height:16px; border-radius:3px; animation:fall 1.5s ease-in forwards;}
@keyframes fall{to{transform:translateY(90vh) rotate(540deg); opacity:0}}

/* ---------- quiz ---------- */
.quiz-wrap{max-width:680px; margin:0 auto;}
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.progress{flex:1;height:12px;background:#F2E6DA;border-radius:999px;overflow:hidden;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px;transition:width .3s;}
.qcard{
  background:#fff;border-radius:var(--r-xl);padding:26px 20px;box-shadow:var(--sh);text-align:center;position:relative;overflow:hidden;
}
.qcard .qtag{display:inline-block;font-size:12px;font-weight:900;color:var(--sky-d);background:var(--sky-l);border-radius:999px;padding:5px 12px;margin-bottom:10px;}
.qcard .qtext{font-size:clamp(22px,5.4vw,32px);font-weight:900;letter-spacing:-.8px;line-height:1.3;margin:0 0 4px;}
.qcard .qsub{color:var(--ink2);font-size:14.5px;margin:0 0 8px;}
.qbig{font-size:clamp(52px,15vw,84px);line-height:1.1;margin:6px 0 10px;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px;}
.opts.three{grid-template-columns:repeat(3,1fr);}
.opt{
  background:var(--cream); border-radius:var(--r-lg); padding:14px 8px; min-height:118px; border:2.5px solid transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:.15s; box-shadow:var(--sh-sm);
}
.opt .em{font-size:clamp(34px,10vw,46px); line-height:1.1;}
.opt .lb{font-size:14px; font-weight:800; color:var(--ink2);}
.opt:active{transform:scale(.97);}
.opt.right{background:#E7F8EF; border-color:var(--mint); animation:pop .3s;}
.opt.wrong{background:#FFEDE9; border-color:#F5B5AA; animation:shake .32s;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qfoot{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap;}

/* ---------- learn / curriculum ---------- */
.steptabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;}
.steptab{
  flex:0 0 auto; min-width:120px; background:#fff;border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh-sm);
  text-align:left;border:2px solid transparent;
}
.steptab .n{font-size:11px;font-weight:900;color:var(--ink3);letter-spacing:.4px;}
.steptab b{display:block;font-size:14px;letter-spacing:-.3px;line-height:1.3;}
.steptab.on{border-color:var(--coral);background:#FFF7F3;}
.steptab.on .n{color:var(--coral-d);}
.goalcard{background:linear-gradient(150deg,#FFFDF8,#FFF4E8);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm);border:1px solid #F6E7D5;}
.goalcard h4{margin:0 0 6px;font-size:16px;}
.goalcard ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px;}
.goalcard li{margin:3px 0;}
.tipbox{background:var(--mint-l);border-radius:var(--r);padding:14px 16px;font-size:14px;color:#2C6E5C;line-height:1.6;}
.tipbox b{color:#1F5A4A;}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.wordcard{background:#fff;border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--sh-sm);}
.wordcard .em{font-size:30px;display:block;}
.wordcard b{display:block;font-size:13.5px;margin-top:2px;}
.wordcard span{font-size:11.5px;color:var(--ink3);}
.nuricard{background:#fff;border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm);}
.nuricard h4{margin:0 0 4px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.nuricard .area{font-size:12px;color:var(--ink3);font-weight:700;}
.checklist{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.checklist label{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.45;padding:7px 8px;border-radius:12px;cursor:pointer;}
.checklist label:hover{background:var(--cream);}
.checklist input{width:20px;height:20px;accent-color:var(--mint-d);flex:0 0 20px;margin-top:1px;}
.checklist .cwrap b{display:block;font-weight:700;}
.checklist .cwrap span{color:var(--ink3);font-size:12px;}
.areaprog{height:8px;background:#F2E6DA;border-radius:999px;overflow:hidden;margin-top:8px;}
.areaprog i{display:block;height:100%;background:var(--mint);border-radius:999px;}

/* ---------- plan ---------- */
.week{display:grid;gap:12px;}
@media(min-width:820px){ .week{grid-template-columns:repeat(auto-fit,minmax(186px,1fr)); align-items:start;} }
@media(min-width:1500px){ .week{grid-template-columns:repeat(7,minmax(0,1fr));} }
.day{background:#fff;border-radius:var(--r-lg);padding:12px;box-shadow:var(--sh-sm);}
.day.today{outline:2.5px solid var(--coral);}
.day .dh{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.day .dh b{font-size:14.5px;}
.day .dh .d{font-size:11px;color:var(--ink3);font-weight:700;}
.day .dh .t{font-size:10.5px;background:var(--coral);color:#fff;padding:2px 7px;border-radius:999px;font-weight:800;margin-left:auto;}
.pitem{display:flex;align-items:flex-start;gap:7px;background:var(--cream);border-radius:12px;padding:8px 9px;margin-bottom:6px;font-size:12.5px;line-height:1.4;}
.pitem .pi{flex:1;min-width:0;}
.pitem b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;letter-spacing:-.2px;line-height:1.35;word-break:keep-all;}
.pitem span{color:var(--ink3);font-size:11px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.pitem.done{background:#F4FBF0;}
.pitem.done b{text-decoration:line-through;color:#89A06F;}
.pitem .del{color:var(--ink3);font-size:14px;padding:0 2px;}
.pitem .ck{font-size:15px;}
.addday{width:100%;border:1.5px dashed #EAD8C6;border-radius:12px;padding:8px;color:var(--ink3);font-size:12.5px;font-weight:800;}

/* ---------- settings ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=url],.field select,.field textarea{
  width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:0;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-l);}
.field textarea{min-height:150px;resize:vertical;font-size:14px;line-height:1.6;}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);}
.switch:last-child{border-bottom:0;}
.switch b{font-size:14.5px;}
.switch span{font-size:12px;color:var(--ink3);display:block;}
.toggle{width:56px;height:32px;border-radius:999px;background:#E9DDD2;position:relative;flex:0 0 56px;transition:.2s;}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:.2s;}

/* ---------- parts, audio player, pick & play count ---------- */
.tb.audio{background:#E8F6FF;color:#1D6A96;}
.tb.parts{background:#F3EBFF;color:#5D3E9E;}
.tact.on{background:#FFF4D6;color:#9A6200;border-color:#F0C86A;}
.parts-list{display:flex;flex-direction:column;gap:8px;}
.part-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--cream);border:1.5px solid var(--line);transition:.15s;}
.part-btn:hover{border-color:var(--sky);background:#F5FBFF;}
.part-btn .pt-time{font-weight:800;font-size:12.5px;color:var(--sky-d);background:#fff;padding:3px 8px;border-radius:999px;border:1px solid var(--line);flex-shrink:0;}
.part-btn b{flex:1;min-width:0;font-size:13.5px;}
.audio-player-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;background:linear-gradient(150deg,#FFFDF8,#FFF1E6);border-radius:var(--r-lg);text-align:center;min-height:220px;}
.audio-player-box .ap-emo{font-size:54px;margin-bottom:8px;}
.channelbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.toggle.on{background:var(--mint-d);}
.toggle.on::after{left:28px;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
.kv b{font-weight:800;}
input[type=range]{width:100%;accent-color:var(--coral);}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5;margin-top:6px;}
.filebtn{position:relative;overflow:hidden;}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* ============================================================
   kids mode: mascot, chunky buttons, sticker book
   ============================================================ */
.hero{
  position:relative; display:flex; align-items:center; gap:6px;
  background:linear-gradient(135deg,#FFF6E6 0%,#FFE9E1 46%,#E3F7F0 100%);
  border-radius:34px; padding:14px 16px 14px 8px; box-shadow:var(--sh);
  overflow:hidden; border:2px solid #FFF2DC;
}
.hero::after{content:''; position:absolute; right:-30px; bottom:-40px; width:140px; height:140px; background:radial-gradient(circle,#FFF3C9 0%,rgba(255,243,201,0) 70%);}
.hero-mascot{flex:0 0 auto; display:grid; place-items:center; filter:drop-shadow(0 6px 10px rgba(180,140,90,.18));}
.bubble{
  position:relative; background:#fff; border-radius:22px; padding:12px 16px; box-shadow:var(--sh-sm);
  flex:1; min-width:0; border:2px solid #FFF0DD;
}
.bubble::before{
  content:''; position:absolute; left:-9px; top:50%; transform:translateY(-50%) rotate(45deg);
  width:18px; height:18px; background:#fff; border-left:2px solid #FFF0DD; border-bottom:2px solid #FFF0DD;
}
.bubble b{display:block; font-size:clamp(16px,4.4vw,20px); letter-spacing:-.5px; line-height:1.3; color:#4A3B32;}
.bubble span{display:block; font-size:12.5px; color:#9A8478; margin-top:3px; font-weight:700;}
.mascot.bob{animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.mascot.cheer{animation:cheer .6s ease-in-out infinite alternate;}
@keyframes cheer{from{transform:rotate(-6deg) scale(.98)}to{transform:rotate(6deg) scale(1.04)}}

.kbig{display:grid; gap:12px; margin-top:14px;}
@media(min-width:700px){ .kbig{grid-template-columns:repeat(3,1fr);} }
.kareas{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px;}
.kbtn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:18px 12px; border-radius:30px; background:#fff; border:0;

  min-height:132px;
}
.kbtn .ke{font-size:44px; line-height:1; filter:drop-shadow(0 3px 3px rgba(0,0,0,.08));}
.kbtn b{font-size:19px; letter-spacing:-.5px; margin-top:6px;}
.kbtn span{font-size:12.5px; color:#7C6C62; font-weight:700;}
.kbtn:active{transform:translateY(4px) scale(.99); box-shadow:0 2px 0 rgba(0,0,0,.06), var(--sh-sm);}
.kbtn.c1{background:linear-gradient(150deg,#FFE9E1,#FFD9CE);}
.kbtn.c2{background:linear-gradient(150deg,#E6F8F0,#D6F2E8);}
.kbtn.c3{background:linear-gradient(150deg,#E9F4FD,#DCECFB);}
.kbtn.c4{background:linear-gradient(150deg,#FFF3D9,#F7E7FF);}
.resume-banner{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  margin-top:10px; padding:10px 13px; border-radius:18px;
  background:#1E2025; color:#fff; box-shadow:var(--sh);
}
.resume-banner .rb-ico{
  width:34px; height:34px; border-radius:11px; background:#FF4D4F; color:#fff;
  display:grid; place-items:center; font-size:15px; flex-shrink:0;
}
.resume-banner .rb-body{flex:1; min-width:0;}
.resume-banner .rb-body b{display:block; font-size:14px; letter-spacing:-.2px;}
.resume-banner .rb-body span{display:block; font-size:11.5px; color:#F5B74F; font-weight:700; margin-top:1px;}
.resume-banner .rb-arr{font-size:18px; color:#A8B0BC; font-weight:700;}
.vhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px;}
.vh-left{display:flex; align-items:center; gap:10px; min-width:0;}
.vh-logo{
  width:38px; height:38px; border-radius:12px; color:#fff; font-weight:800; font-size:17px;
  display:grid; place-items:center; flex-shrink:0; box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.vsec{margin:12px 2px 6px; font-size:13.5px; font-weight:800; color:#332A24;}
.vlist{display:flex; flex-direction:column; gap:7px;}
.vcard{
  position:relative; display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:10px 13px; border-radius:18px; background:#fff; border:1px solid #EFEAE2;
  box-shadow:0 3px 10px rgba(90,70,50,.04); transition:transform .1s;
}
.vcard:active{transform:scale(.99);}
.vc-ico{
  width:38px; height:38px; border-radius:12px; color:#fff; font-weight:800; font-size:16px;
  display:grid; place-items:center; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.vc-body{flex:1; min-width:0;}
.vc-body b{display:block; font-size:14.5px; color:#231F20; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.vc-body span{display:block; font-size:11.5px; color:#8A7E76; margin-top:1px;}
.vc-badge{
  background:#4F46E5; color:#fff; font-size:10px; font-weight:800; padding:3px 7px;
  border-radius:999px; margin-right:4px;
}
.vc-arr{font-size:20px; color:#C0B5AD; font-weight:700;}
.compact-chips{display:flex; flex-wrap:nowrap; overflow-x:auto; gap:6px; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.compact-chips::-webkit-scrollbar{display:none;}
.chip.kchip.sm{padding:6px 11px; font-size:12px; border-radius:999px; white-space:nowrap; flex-shrink:0;}

.card.cute{border-radius:30px; border:2px solid #FFF2E2; box-shadow:0 8px 0 rgba(180,140,90,.05), var(--sh-sm);}
.empty.cute{border-radius:28px;}

.cover{
  width:58px; height:58px; flex:0 0 58px; border-radius:20px; display:grid; place-items:center;
  font-size:28px; background:linear-gradient(145deg,#FFF3DE,#FFE7D5);
}

.stickerboard.cute{gap:9px;}
.stickerboard.cute .sticker{
  border-radius:16px; background:#FFF6E9; font-size:clamp(13px,3vw,22px);
  box-shadow:inset 0 -2px 0 rgba(200,160,120,.10);
}
.stickerboard.cute .sticker.fill{
  background:linear-gradient(145deg,#FFF0C2,#FFE39A);
  animation:stickerin .35s ease-out;
}
@keyframes stickerin{from{transform:scale(.4) rotate(-12deg); opacity:0}to{transform:none; opacity:1}}

.modebtn{
  width:100%; padding:12px; border-radius:18px; background:#fff; box-shadow:var(--sh-sm);
  font-weight:800; font-size:13.5px; color:#7C6C62; text-align:center;
}
.modebtn:active{transform:scale(.98);}
.tabbar.kid{background:rgba(255,252,246,.96); padding-left:4px; padding-right:4px;}
.tabbar.kid button{font-size:10.5px; white-space:nowrap; padding:6px 2px;}
.tabbar.kid button .ico{font-size:21px;}
.tabbar.kid button.on{background:#FFE7E1; color:#D65B47;}

.kchip{font-size:14px; padding:10px 15px; border-radius:999px;}
.kgrid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(158px,1fr));}
.kcard{
  background:#fff; border-radius:26px; padding:10px; box-shadow:0 5px 0 rgba(180,140,90,.06), var(--sh-sm);
  border:2px solid #FFF3E6; display:flex; flex-direction:column;
}
.kcard-main{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; padding:4px; border-radius:18px;}
.kcard-main:active{transform:scale(.98);}
.kcover{
  position:relative; width:100%; aspect-ratio:1.35; border-radius:18px; display:grid; place-items:center;
  font-size:40px; background:linear-gradient(145deg,#FFF4E2,#FFE8D6); margin-bottom:6px;
}
.kcover .kn{
  position:absolute; left:7px; top:7px; background:#fff; border-radius:999px; font-size:10.5px;
  font-weight:900; padding:2px 7px; color:#C4523F; box-shadow:var(--sh-sm);
}
.kcard b{font-size:13.5px; letter-spacing:-.3px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.kthumb-book{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:14px; display:block; background:#FFF4DF;}
.kcard-top{position:relative; cursor:pointer;}
.ktiny{font-size:11px; color:#A79690; font-weight:700;}
.kacts{display:flex; gap:5px; margin-top:8px;}
.kbtn-mini{
  flex:1; text-align:center; padding:9px 6px; border-radius:14px; font-size:12.5px; font-weight:900;
  background:#FFE7E1; color:#C4523F; box-shadow:0 3px 0 rgba(196,82,63,.15); text-decoration:none;

#cheer{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) scale(.8); opacity:0; pointer-events:none; transition:.22s; z-index:96;}

.cheer-card{
  display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:8px 18px 8px 8px;
  box-shadow:var(--sh-big); border:3px solid #FFE9A8; font-weight:900; font-size:15px; color:#C4523F;
}

/* compact kid buttons on phones */
@media(max-width:560px){
  .kbig{grid-template-columns:repeat(3,1fr); gap:9px;}
  .kbtn{min-height:112px; padding:14px 6px; border-radius:26px;}
  .kbtn .ke{font-size:32px;}
  .kbtn b{font-size:13.5px; margin-top:4px;}
  .kbtn span{font-size:10.5px;}
  .hero{padding:10px 12px 10px 4px; border-radius:30px;}

  .bubble b{font-size:15px;}
}

.stickerboard.cute .sticker{border-radius:14px; aspect-ratio:1/1;}

/* ---------- thumbnail cards ---------- */
.thumb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:860px;}
.thumb-grid.mom{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));max-width:none;}
.tcard{background:#fff;border-radius:22px;padding:8px;box-shadow:0 5px 0 rgba(180,140,90,.06), var(--sh-sm);border:2px solid #FFF3E6;}
.tcard.compact{border-radius:18px;}
.tthumb{
  position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  background:linear-gradient(145deg,#FFF3E1,#FFE7D7);padding:0;
}

.tthumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;}
.tplay{
  position:absolute;right:7px;bottom:7px;z-index:3;width:36px;height:36px;border-radius:50%;

  box-shadow:0 4px 10px rgba(0,0,0,.18);
}
.tb{
  position:absolute;left:6px;top:6px;z-index:3;background:rgba(255,255,255,.95);border-radius:999px;

}
.tb + .tb{left:auto;right:6px;}
.tb.ar{color:#9A6B12;background:#FFF3D2;}
.tb.ar.off{color:#A79690;background:rgba(255,255,255,.9);}
.tb.print{left:auto;right:44px;background:#F1F7E8;color:#5D7F2E;}
.tmeta{padding:7px 5px 3px;}
.tmeta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.35;letter-spacing:-.2px;word-break:keep-all;}
.tmeta span{display:block;font-size:10.5px;color:#A79690;font-weight:700;margin-top:3px;}
.tactions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.tact{flex:1;min-width:36px;padding:7px 4px;border-radius:11px;background:#FFF6EC;font-size:11px;font-weight:800;color:#7C6C62;}

/* ---------- player ---------- */
.player-page{max-width:980px;margin:0 auto;}
.player-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.player-title{font-size:17px;letter-spacing:-.4px;display:block;line-height:1.3;}
.player-wrap{position:relative;background:#221a15;border-radius:26px;overflow:hidden;box-shadow:var(--sh);}

.nx-emoji{font-size:34px;}
.nx-title{display:block;font-size:16px;margin-top:2px;}

.nx-btns{display:flex;gap:8px;margin-top:14px;}
.nx-btns .btn{flex:1;}
.nextrow{max-width:320px;}
.pf-badge{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));}
.player-fallback b{font-size:17px;}
.player-fallback .btn.primary{margin-top:8px;}
.player-fallback{background-color:#2a211c;}
.player-fallback::before{content:'';position:absolute;inset:0;background:rgba(24,17,13,.55);}
.player-fallback > *{position:relative;z-index:1;}
.pf-msg{color:#F3E6DA;line-height:1.55;max-width:300px;}
.pf-hint{color:#E9D8CB;margin-top:8px;}

/* ---------- PECS ---------- */
.pecs-hero{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.pecs-bubble{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:var(--sh-sm);border:2px solid #FFF0DD;flex:1;}
.pecs-bubble b{display:block;font-size:15.5px;letter-spacing:-.4px;}
.pecs-bubble span{display:block;font-size:12px;color:#9A8478;margin-top:3px;font-weight:700;}

  transition:transform .1s;
}
.pecs-card:active{transform:scale(.96);}
.pecs-card .pc-em{font-size:32px;line-height:1.1;}
.pecs-card b{font-size:12.5px;letter-spacing:-.2px;word-break:break-word;line-height:1.2;}
.pecs-card .pc-ko{font-size:10.5px;color:#8A776C;font-weight:700;}
.pecs-card.yellow{background:#FFF6C9;border-color:#F3DE8A;}

/* ---------- age / owned ---------- */
.tcard{position:relative;}
.ownbtn{
  position:absolute;left:10px;bottom:10px;z-index:4;width:32px;height:32px;border-radius:12px;
  background:rgba(255,255,255,.9);font-size:15px;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.14);opacity:.55;transition:.15s;
}

.ownbtn:active{transform:scale(.92);}
.age-note{background:#F1E9FF;border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:13px;color:#5B4794;line-height:1.5;}
.age-note b{display:block;font-size:14.5px;}
.age-note span{font-size:12px;color:#7C6BA8;}

/* ---------- roadmap ---------- */
.rm-head{margin-bottom:14px;}
.rm-step{display:flex;gap:12px;background:#fff;border-radius:24px;padding:14px;margin-bottom:10px;box-shadow:0 4px 0 rgba(180,140,90,.05), var(--sh-sm);border:2px solid #FFF3E6;}
.rm-step.done{background:#F6FCF2;border-color:#DCEFD0;}
.rm-step.doing{background:#FFFBF0;border-color:#F6E3B8;}
.rm-num{flex:0 0 38px;width:38px;height:38px;border-radius:14px;background:#FFF0DC;display:grid;place-items:center;font-weight:900;color:#C4713F;}
.rm-body{flex:1;min-width:0;}
.rm-status{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.rm-st{padding:6px 12px;border-radius:999px;background:#FFF6EC;font-size:12px;font-weight:800;color:#8A776C;}
.rm-st.on.todo{background:#EFE7DE;color:#6B5A50;}
.rm-st.on.doing{background:#F7D9A0;color:#7A4E12;}
.rm-st.on.done{background:#8ED8AE;color:#fff;}
.rm-line{display:flex;gap:8px;margin-top:8px;align-items:flex-start;}
.rm-k{flex:0 0 78px;font-size:11.5px;font-weight:900;color:#A79690;padding-top:3px;}
.rm-v{display:flex;gap:5px;flex-wrap:wrap;}
.rm-tag{background:#EAF4FC;color:#2F6E9C;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:800;}
.rm-tag.alt{background:#EDE6FD;color:#5B4794;}
.rm-tag.work{background:#FFF3D2;color:#8A6A0F;}
.rm-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.rm-tip{margin-top:10px;background:#E9F8F2;border-radius:12px;padding:9px 11px;font-size:12.5px;color:#2C6E5C;line-height:1.5;}
.rm-notes{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
.rm-note{background:#FFF8E8;border-radius:10px;padding:7px 10px;font-size:12.5px;color:#6E5A45;display:flex;gap:6px;align-items:flex-start;}
.rm-note span{flex:1;}
.rm-note-x{color:#B99C7C;font-size:11px;padding:0 2px;}
.rm-addnote{margin-top:8px;}
.tthumb{cursor:pointer;}
.tthumb .ownbtn{left:8px;bottom:8px;}
.ownbtn.on{background:#FFF2C9;}
.pecs-card.pink{background:#FFE6F0;border-color:#F3AFC8;}
.pecs-cat.pink{background:#FFE6F0;color:#A83F69;}
.pecs-card.has-img{padding:5px 4px;}
.pecs-card .pc-img{width:100%;height:62px;object-fit:contain;border-radius:10px;background:#fff;margin-bottom:2px;}

.pecs-print-card .pp-img{width:80%;max-height:22mm;object-fit:contain;display:block;margin:0 auto;}

/* ---------- word cards (sight / theme) ---------- */
.wc-head{display:flex;align-items:flex-start;gap:10px;}
.wc-head b{font-size:16px;}
.wc-head > div:first-child{flex:1;}
.wc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;}
.wcard{
  position:relative;background:#fff;border:3px solid #2E2724;border-radius:18px;
  padding:14px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 rgba(0,0,0,.06);min-height:132px;justify-content:center;
}
.wcard.done{background:#FFFCEF;border-color:#2E2724;}
.wcard .ring{position:absolute;top:6px;left:12px;width:9px;height:9px;border:2.5px solid #2E2724;border-radius:50%;background:#fff;}
.wcard .ring.r2{left:auto;right:12px;}
.wcard .wc-word{font-size:20px;font-weight:900;letter-spacing:-.3px;padding:4px 2px;color:#231C19;}
.wcard .wc-word.small{font-size:16px;}
.wcard .wc-pic{font-size:34px;line-height:1.1;padding:2px;}
.wcard .wc-ko{font-size:11px;color:#8A776C;font-weight:700;}
.wcard .wc-ok{margin-top:6px;font-size:10.5px;font-weight:900;color:#B49C86;background:#FFF6EC;border-radius:999px;padding:4px 8px;}
.wcard.done .wc-ok{color:#C4713F;background:#FFEFC9;}

/* print: sight cards, 12 per A4 */
.sight-page{page-break-after:always;}
.sight-page:last-child{page-break-after:auto;}
.sight-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:4mm;height:262mm;}
.sight-card{
  border:1.5pt solid #231C19;border-radius:5mm;padding:4mm 2mm;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;
  break-inside:avoid;page-break-inside:avoid;
}
.sight-card .sc-ring{position:absolute;top:3mm;left:5mm;width:3mm;height:3mm;border:0.8pt solid #231C19;border-radius:50%;}
.sight-card .sc-ring.sc2{left:auto;right:5mm;}
.sight-card .sc-img{max-height:22mm;max-width:80%;object-fit:contain;}

.sight-card .sc-word{font-size:22pt;font-weight:900;letter-spacing:-.5pt;}

function parseTimeSec(str) {
  var parts = String(str || '').trim().split(':').map(function (x) { return parseInt(x, 10); });
  if (!parts.length || parts.some(isNaN)) return 0;
  if (parts.length === 1) return Math.max(0, parts[0]);
  if (parts.length === 2) return Math.max(0, parts[0] * 60 + parts[1]);
  return Math.max(0, parts[0] * 3600 + parts[1] * 60 + parts[2]);
}

}
function songMatchesTopic(s, subj, sub) {

  if (matchSubj && matchSub) return true;
  if (s.extraTopics && s.extraTopics.some(function (t) {

  if (s.parts && s.parts.some(function (p) {

  })) return true;

}

var AudioDB = {
  db: null,
  open: function (cb) {
    if (AudioDB.db) { cb(null, AudioDB.db); return; }
    if (!window.indexedDB) { cb(new Error('no indexedDB')); return; }
    try {
      var req = indexedDB.open('hangyeol_audio_db', 1);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath: 'id' });
      };
      req.onsuccess = function (e) { AudioDB.db = e.target.result; cb(null, AudioDB.db); };
      req.onerror = function (e) { cb(e.target.error || new Error('idb err')); };
    } catch (err) { cb(err); }
  },
  put: function (id, name, blob, cb) {
    AudioDB.open(function (err, db) {
      if (err) { if (cb) cb(err); return; }
      var tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').put({ id: id, name: name || 'audio', blob: blob, t: Date.now() });
      tx.oncomplete = function () { if (cb) cb(null); };
      tx.onerror = function (e) { if (cb) cb(e.target.error); };
    });
  },
  get: function (id, cb) {
    AudioDB.open(function (err, db) {
      if (err) { cb(err, null); return; }
      var req = db.transaction('tracks', 'readonly').objectStore('tracks').get(id);
      req.onsuccess = function () { cb(null, req.result || null); };
      req.onerror = function (e) { cb(e.target.error, null); };
    });
  },
  del: function (id, cb) {
    AudioDB.open(function (err, db) {
      if (err) { if (cb) cb(err); return; }
      var tx = db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').delete(id);
      tx.oncomplete = function () { if (cb) cb(null); };
    });
  }
};

/* ORT·그림책 key_words → 낱말 카드 (사전에 있으면 뜻·그림, 없으면 단어만) */
function kwToWords(kw) {
  var out = [], seen = {};
  kw.forEach(function (raw) {
    var w = String(raw || '').trim();
    if (!w) return;
    var key = w.toLowerCase();
    if (seen[key]) return;
    seen[key] = 1;
    var d = DICT[key];
    if (d) out.push({ w: d.w, ko: d.ko, e: d.e });
    else out.push({ w: w, ko: '', e: /\?|\.\.\.|!$| /.test(w) ? '💬' : '📖' });
  });
  return out;
}

function extractWords(lyrics, n) {
  var out = [], seen = {};
  function push(k) {
    var d = DICT[k];
    if (!d || seen[k]) return;
    seen[k] = 1; out.push({ w: d.w, ko: d.ko, e: d.e });
  }
  (SONG_WORDS[n] || []).forEach(push);
  var toks = lyrics.toLowerCase().replace(/[^a-z' ]+/g, ' ').split(/\s+/);
  for (var i = 0; i < toks.length; i++) {
    var t = toks[i].replace(/^'+|'+$/g, '');
    if (!t) continue;
    if (DICT[t]) { push(t); continue; }
    if (/s$/.test(t) && DICT[t.slice(0, -1)]) push(t.slice(0, -1));
  }
  if (out.length < 3) {
    ['hello', 'clap', 'dance', 'happy', 'friend', 'sing'].forEach(push);
  }
  return out.slice(0, 10);
}

function pickVoice(lang) {
  if (!voicesCache.length) loadVoices();
  var exact = voicesCache.filter(function (v) { return v.lang && v.lang.replace('_', '-') === lang; });
  if (exact.length) {
    var good = exact.filter(function (v) { return /Samantha|Google|Microsoft|Yuna|Sora|natural|Premium|Enhanced/i.test(v.name); });
    return (good[0] || exact[0]);

}
function speak(text, lang, rateOverride) {
  if (!text) return;
  if (!window.speechSynthesis) { toast('이 기기에서는 음성 읽기를 지원하지 않아요'); return; }
  try {
    var ss = window.speechSynthesis;
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = lang || 'en-US';
    var v = pickVoice(u.lang);
    if (v) u.voice = v;
    u.rate = rateOverride || (S && S.settings ? S.settings.rate : 0.85);
    u.pitch = 1.05;
    u.volume = 1;
    if (ss.paused) ss.resume();
    if (ss.speaking || ss.pending) {
      ss.cancel();
      setTimeout(function () {
        try { ss.speak(u); } catch (e) {}
      }, 60);
    } else {
      ss.speak(u);
    }
  } catch (e) { /* no speech available */ }
}

  try {

function chime(good) {
  if (S && S.settings && S.settings.sound === false) return;
  var ctx = audioCtx();
  if (!ctx) return;
  var notes = good ? [659.25, 783.99, 1046.5] : [392, 329.63];
  notes.forEach(function (f, i) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.09 + 0.34);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + i * 0.09); o.stop(ctx.currentTime + i * 0.09 + 0.36);
  });
}

var STICKERS = ['⭐', '🐣', '🐻', '🦊', '🦕', '🌈', '🍓', '🦄', '🐼', '🐨', '🐰', '🌻'];
function addSticker(n) {
  S.stickers = S.stickers || [];
  S.sightDone = S.sightDone || {};
  for (var i = 0; i < (n || 1); i++) {
    var pickIx = (S.stickers.length + i) % STICKERS.length;
    S.stickers.push({ e: STICKERS[pickIx], t: Date.now() });
  }
  if (S.stickers.length > 120) S.stickers = S.stickers.slice(-120);
}

function go(v) {
  if (App.view === 'player' && v !== 'player') {
    if (typeof stopAutoNext === 'function') stopAutoNext();
    if (typeof toggleTheater === 'function') toggleTheater(false);
    if (typeof YTP !== 'undefined') {
      clearTimeout(YTP.watch);
      if (YTP.player && YTP.player.stopVideo) { try { YTP.player.stopVideo(); } catch (e) { } }
    }
  }
  App.view = v;
  if (location.hash !== '#' + v) { try { history.replaceState(null, '', '#' + v); } catch (e) { } }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'auto' : 'auto' });
  render();
}
function render() {
  renderChrome();
  var v = document.getElementById('view');
  if (!v) return;
  var html = '';
  try {
    if (App.view === 'home') html = viewHome();
    else if (App.view === 'library') html = viewLibrary();
    else if (App.view === 'books') html = viewBooks();
    else if (App.view === 'review') html = viewReview();
    else if (App.view === 'learn') html = viewLearn();
    else if (App.view === 'pecs') html = viewPecs();
    else if (App.view === 'roadmap') html = viewRoadmap();
    else if (App.view === 'plan') html = viewPlan();
    else if (App.view === 'settings') html = viewSettings();
    else if (App.view === 'player') html = viewPlayer();
    else html = viewHome();
  } catch (err) {
    html = '<div class="card"><h3>앗, 문제가 생겼어요</h3><p class="muted tiny">' +
      esc(err && err.message ? err.message : String(err)) + '</p></div>';
    if (window.console) console.error(err);
  }
  v.innerHTML = html;
  if (App.view === 'player' && typeof mountPlayerIfNeeded === 'function') mountPlayerIfNeeded();
}

/* ---------- modal ---------- */
var modalStack = [];
function openModal(title, bodyHtml, footerHtml, wide) {
  var ov = document.getElementById('overlay');
  var sheet = document.getElementById('sheet');
  sheet.style.maxWidth = wide ? '860px' : '720px';
  sheet.innerHTML =
    '<header><h3>' + esc(title) + '</h3><button class="iconbtn" data-act="close-modal" aria-label="닫기">✕</button></header>' +
    '<div class="content" id="modal-body">' + bodyHtml + '</div>' +
    (footerHtml ? '<footer>' + footerHtml + '</footer>' : '');
  ov.classList.add('on');
  modalStack.push(title);
  var c = document.getElementById('modal-body');
  if (c) c.scrollTop = 0;
}
function closeModal() {
  var ov = document.getElementById('overlay');
  if (ov) ov.classList.remove('on');
  var sheet = document.getElementById('sheet');
  if (sheet) sheet.innerHTML = '';
  modalStack = [];
}
function confirmBox(msg, onYes, yesLabel) {
  openModal('확인해 주세요',
    '<p style="font-size:15px;line-height:1.6">' + msg + '</p>',
    '<button class="btn ghost" data-act="close-modal">취소</button>' +
    '<button class="btn primary" id="confirm-yes">' + (yesLabel || '네, 할게요') + '</button>');
  var b = document.getElementById('confirm-yes');
  if (b) b.onclick = function () { closeModal(); onYes(); };
}

function allThemes() {
  return THEMES.concat((S && S.customThemes) ? S.customThemes : []);

function stepById(id) {
  var all = EN_STEPS.concat(MA_STEPS).concat(KO_STEPS);
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}
function nuriByKey(k) {
  for (var i = 0; i < NURI.length; i++) if (NURI[i].key === k) return NURI[i];
  return null;
}

/* plan item → 표시용 {type, ref, title, meta} */
function resolveItem(it, dayKeyStr, idx, themeId) {
  var out = { type: it.type, ref: it.ref || '', title: '', meta: '', id: '' };
  if (it.type === 'song') {
    var s = songById(it.ref);
    out.title = s ? short(cleanTitle(s.title), 26) : '(삭제된 노래)';
    out.meta = '오늘의 노래' + (s ? ' · ' + (s.subtopic || '') : '');
  } else if (it.type === 'book') {
    var b = songById(it.ref);
    out.title = b ? short(cleanTitle(b.title), 26) : '(삭제된 책)';
    out.meta = '오늘의 책' + (b ? (b.stage ? ' · ' + b.stage : '') + (b.ar ? ' · AR ' + b.ar : '') : '');
  } else if (it.type === 'expr') {
    out.title = it.text || '';
    out.meta = '오늘의 영어 표현';
  } else if (it.type === 'step') {
    var st = stepById(it.ref);
    out.title = st ? (it.ref.indexOf('en') === 0 ? '영어' : it.ref.indexOf('ma') === 0 ? '수학' : '한글') + ' Step ' + st.n : '(단계)';
    out.meta = st ? st.ko : '';
  } else if (it.type === 'nuri') {
    var a = nuriByKey(it.ref);
    out.title = '누리 · ' + (a ? a.name : '놀이');
    out.meta = a ? short(a.intro, 26) : '';
  } else if (it.type === 'review') {
    out.title = '이번 주 낱말 복습';
    out.meta = '단어 놀이 · 5분';
  }
  out.id = it.id || (themeId ? 'th' + themeId + '-' + dayKeyStr + '-' + idx : uid('p'));
  return out;
}

function buildThemePlan(theme) {
  var plan = {};
  DAYKEYS.forEach(function (dk) {
    plan[dk] = (theme.days[dk] || []).map(function (it, i) {
      var r = resolveItem(it, dk, i, theme.id);
      return { id: r.id, type: it.type, ref: it.ref || '', title: r.title, meta: r.meta, text: it.text || '' };
    });
  });
  return plan;
}

function themeProgress(theme) {
  var total = 0, done = 0;
  DAYKEYS.forEach(function (dk) {
    var items = (theme.days[dk] || []);
    total += items.length;
    items.forEach(function (it, i) {
      var r = resolveItem(it, dk, i, theme.id);
      if (planDone(r.id)) done++;
    });
  });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

function applyTheme(theme) {
  S.plan = buildThemePlan(theme);
  S.activeTheme = { id: theme.id, n: theme.n, title: theme.title, at: Date.now() };
  save();
  render();
  toast('‘' + theme.title + '’ 계획을 적용했어요!');
}

/* ============================================================

   ============================================================ */

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(a, n) { return shuffle(a).slice(0, n); }
function rnd(n) { return Math.floor(Math.random() * n); }
function dictOpt(key) { var d = DICT[key]; return { lb: d.ko, em: d.e, ok: false }; }

function uniqOpts(list) {
  var seen = {}, out = [];
  list.forEach(function (o) {
    if (!o) return;
    var k = (o.em || '') + '|' + (o.lb || '');
    if (seen[k]) return;
    seen[k] = 1; out.push(o);
  });
  return out;
}

/* ---- picture word quiz: hear the English word, tap the picture ---- */
function qWord(keys, n) {
  var qs = [];
  var pool = keys.filter(function (k) { return DICT[k]; });
  pick(pool, n).forEach(function (k) {
    var d = DICT[k];
    var others = pick(DICT_BY_WORD.filter(function (w) { return w.e !== d.e && w.ko !== d.ko; }), 8);
    var opts = uniqOpts([{ lb: d.ko, em: d.e, ok: true }].concat(others.map(function (w) { return { lb: w.ko, em: w.e }; }))).slice(0, 3);

/* ---- counting ---- */
function qCount(maxN, n) {
  var items = ['🍎', '⭐', '🌸', '🐟', '⚽', '🍓', '🎈', '🐤'];
  var qs = [];
  for (var i = 0; i < n; i++) {
    var c = 1 + rnd(maxN);
    var em = items[rnd(items.length)];
    var nums = [c];
    while (nums.length < 3) {
      var v = 1 + rnd(Math.max(maxN, 3));
      if (nums.indexOf(v) < 0) nums.push(v);
    }
    qs.push({
      tag: '수 세기', prompt: '몇 개일까요?', sub: '하나씩 짚으며 세어 보세요',
      big: '<div style="font-size:clamp(28px,8.4vw,42px);line-height:1.5;letter-spacing:5px">' +
        new Array(c + 1).join(em + ' ') + '</div>',
      audioKo: true,
      opts: shuffle(nums.map(function (v) {
        return { lb: '', em: '<span style="font-size:clamp(30px,9vw,44px);font-weight:900">' + v + '</span>', v: v, ok: v === c };
      }))
    });
  }
  return qs;
}

/* ---- more / less ---- */

/* ---- patterns ---- */
function qPattern(n) {
  var items = ['🍎', '⭐', '🌸', '🐟', '🎈', '🟦'];
  var qs = [];
  for (var i = 0; i < n; i++) {
    var a = items[rnd(items.length)];

    var style = rnd(2);

    qs.push({
      tag: '규칙', prompt: '다음에 올 것은 무엇일까요?', sub: '반복되는 규칙을 찾아보세요',

      audioKo: true,
      opts: shuffle([
        { lb: '', em: ans, ok: true },
        { lb: '', em: a === ans ? b : a, ok: false },

    });
  }
  return qs;
}

/* ============================================================
   quiz screen
   ============================================================ */
function startQuiz(title, questions, meta) {
  if (!questions.length) { toast('문제를 만들지 못했어요'); return; }
  App.quiz = { title: title, q: questions, i: 0, correct: 0, wrong: 0, done: false, locked: false, meta: meta || {} };
  render();
  setTimeout(function () { speakQuestion(); }, 260);
}
function speakQuestion() {
  var q = App.quiz && App.quiz.q[App.quiz.i];
  if (!q) return;
  if (q.audio) speak(q.audio.text, q.audio.lang);
  else if (q.audioKo) speak(q.prompt, 'ko-KR');
}
function viewQuiz() {
  var qz = App.quiz;
  if (!qz) return '';
  if (qz.done) return viewQuizResult();
  var q = qz.q[qz.i];
  var pct = Math.round(qz.i / qz.q.length * 100);
  var html = '<div class="quiz-wrap">' +
    '<div class="quiz-top"><button class="iconbtn" data-act="quiz-exit">✕</button>' +
    '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
    '<b class="tiny">' + (qz.i + 1) + ' / ' + qz.q.length + '</b></div>' +
    '<div class="qcard">' +
    '<span class="qtag">' + esc(q.tag || '놀이') + '</span>' +
    '<p class="qtext">' + esc(q.prompt) + '</p>' +
    (q.sub ? '<p class="qsub">' + esc(q.sub) + '</p>' : '') +
    '<div class="qbig">' + (q.big || '') + '</div>' +
    ((q.audio || q.audioKo) ? '<button class="btn sky" data-act="say-q"><span style="font-size:19px">🔊</span> 다시 듣기</button>' : '<div style="height:8px"></div>') +
    '<div class="opts' + (q.opts.length > 2 ? '' : ' two') + '">' +
    q.opts.map(function (o, i) {
      return '<button class="opt" data-act="answer" data-i="' + i + '">' +
        '<div class="em">' + (o.em || '') + '</div>' +
        (o.lb ? '<div class="lb">' + esc(o.lb) + '</div>' : '') + '</button>';
    }).join('') + '</div>' +
    '</div>' +
    '<div class="qfoot"><span class="tiny muted">별 ' + qz.correct + '개 모았어요 ⭐</span></div>' +
    '</div>';
  return html;
}
function answer(idx) {
  var qz = App.quiz;
  if (!qz || qz.done || qz.locked) return;
  var q = qz.q[qz.i];
  var opt = q.opts[idx];
  if (!opt) return;
  var btns = document.querySelectorAll('.opt');
  var btn = btns[idx];
  if (opt.ok) {
    qz.locked = true;
    if (btn) btn.classList.add('right');
    chime(true); confetti(16);
    addStar(1, qz.title + ' 정답');
    qz.correct++;
    celebrate(['잘했어!', '멋져!', '정답이야!', '최고야!', '딩동댕!'][Math.floor(Math.random() * 5)]);
    if (q.wk) {
      S.review = S.review || {};
      var rv = S.review[q.wk] || { ok: 0, no: 0 };
      rv.ok = (rv.ok || 0) + 1; rv.t = Date.now();
      S.review[q.wk] = rv;
      save();
    }
    if (q.audio) speak(DICT && DICT[String(q.audio.text || '').toLowerCase()] ? 'Yes! ' + q.audio.text : 'Yes!', 'en-US');
    setTimeout(function () {
      qz.locked = false;
      qz.i++;
      if (qz.i >= qz.q.length) { finishQuiz(); }
      else { render(); setTimeout(speakQuestion, 200); }
    }, 950);
  } else {
    if (btn) { btn.classList.add('wrong'); setTimeout(function () { btn.classList.remove('wrong'); }, 420); }
    chime(false);
    qz.wrong++;
    speak('Try again!', 'en-US', 0.95);
  }
}
function finishQuiz() {
  var qz = App.quiz;
  qz.done = true;
  addStar(3, qz.title + ' 완료 보너스');
  confetti(30);
  var id = qz.meta && qz.meta.stepId;
  if (id) {
    if (!S.learnDone) S.learnDone = {};
    S.learnDone[id] = (S.learnDone[id] || 0) + 1;
    save();
  }
  render();
}
function viewQuizResult() {
  var qz = App.quiz;
  var total = qz.q.length;
  var got = qz.correct + 3;
  return '<div class="quiz-wrap"><div class="qcard">' +
    '<div style="display:flex;justify-content:center">' + mascotSVG('cheer', 96) + '</div>' +
    '<div style="font-size:26px;margin-top:-6px">🎉 ✨ 🎊</div>' +
    '<p class="qtext">참 잘했어요!</p>' +
    '<p class="qsub">' + esc(qz.title) + ' · ' + total + '문제 중 ' + qz.correct + '개 맞혔어요</p>' +
    '<div class="pill star" style="font-size:15px;padding:9px 16px">⭐ 별 ' + got + '개 받았어요</div>' +
    '<div class="qfoot">' +
    '<button class="btn primary" data-act="quiz-again">한 번 더</button>' +
    '<button class="btn mint" data-act="quiz-next">다음 단계</button>' +
    '<button class="btn ghost" data-act="quiz-exit">그만하기</button>' +
    '</div></div></div>';
}

function coverEmoji(s) {
  if (s.kind === 'book') {
    if (s.subtopic && s.subtopic.indexOf('ORT') > -1) {
      var st = parseFloat(String(s.stage || '1').replace(/[^0-9.]/g, '')) || 1;
      return st >= 7 ? '📙' : st >= 4 ? '📘' : '📗';
    }
    return '📕';
  }
  var set = COVER_SETS[s.subtopic] || ['🎵', '🎶', '🎈', '🧸'];
  return set[(s.n || 0) % set.length];
}

/* 유튜브 제목에서 앞부분만 ( | 로 구분된 꼬리표 제거) */
function cleanTitle(t) {
  t = String(t || '');
  var head = t.split('|')[0].trim();
  if (head.length >= 5) t = head;
  return t.replace(/\s+/g, ' ').trim();
}

function todaySong() {
  var songs = allSongs();
  if (!songs.length) return null;
  var d = new Date();
  var seed = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  return songs[seed % songs.length];
}

function planIco(it) {
  if (it.type === 'song') return '🎵';
  if (it.type === 'book') return '📖';
  if (it.type === 'expr') return '💬';
  if (it.type === 'step') return it.ref && it.ref.indexOf('en') === 0 ? '🔤' : it.ref.indexOf('ma') === 0 ? '🔢' : '가';
  if (it.type === 'nuri') return '🌱';
  if (it.type === 'review') return '⭐';

}

   library
   ============================================================ */
function libSongs() {
  var out = [];
  var isKid = modeOf() === 'kid';
  S.channels.forEach(function (ch) {
    if (App.lib.ch !== '전체' && ch.id !== App.lib.ch) return;
    ch.songs.forEach(function (s) {
      if (isKid && ch.onlySelected && !s.picked) return;
      if (App.lib.onlyPicked && !s.picked) return;
      if (!songMatchesTopic(s, App.lib.subject, App.lib.sub)) return;
      if (App.lib.stage !== '전체' && (s.stage || '') !== App.lib.stage) return;
      if (App.lib.ar !== '전체') {
        var ar = parseFloat(s.ar);
        var hasAr = (s.ar !== '' && s.ar !== null && !isNaN(ar));
        if (App.lib.ar === '확인불가' && hasAr) return;
        if (App.lib.ar === '0-1' && !(hasAr && ar <= 1.0)) return;
        if (App.lib.ar === '1.1-2' && !(hasAr && ar > 1.0 && ar <= 2.0)) return;
        if (App.lib.ar === '2+' && !(hasAr && ar > 2.0)) return;
      }
      if (App.lib.age && App.lib.age !== '전체' && ageGroupOf(s) !== App.lib.age) return;
      if (App.lib.ownedOnly && !s.owned) return;
      if (App.lib.onlyPrint && !(s.prints && s.prints.length)) return;
      if (App.lib.q) {
        var q = App.lib.q.toLowerCase();
        var hay = (s.title + ' ' + (s.lyrics || '') + ' ' + (s.note || '') + ' ' + (s.subtopic || '') + ' ' +
          (s.author || '') + ' ' + (s.stage || '') + ' ' + (s.ar === null ? '' : s.ar) + ' ' +
          ((s.kw || []).join(' ')) + ' ' + (s.series || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return;
      }
      out.push(s);
    });
  });
  if (App.lib.sort === 'AR 낮은 순') {
    out.sort(function (a, b) {
      var x = parseFloat(a.ar), y = parseFloat(b.ar);
      if (isNaN(x)) x = 99; if (isNaN(y)) y = 99;
      return x - y;
    });
  } else if (App.lib.sort === 'AR 높은 순') {
    out.sort(function (a, b) {
      var x = parseFloat(a.ar), y = parseFloat(b.ar);
      if (isNaN(x)) x = -1; if (isNaN(y)) y = -1;
      return y - x;
    });
  } else if (App.lib.sort === 'Stage 순') {
    out.sort(function (a, b) {
      var x = a.stageOrder || 0, y = b.stageOrder || 0;
      if (x !== y) return x - y;
      return (parseFloat(a.ar) || 99) - (parseFloat(b.ar) || 99);
    });
  } else if (App.lib.sort === '단어수 적은 순') {
    out.sort(function (a, b) { return (parseInt(a.wordCount, 10) || 0) - (parseInt(b.wordCount, 10) || 0); });
  } else if (App.lib.sort === '재생 많은 순') {
    out.sort(function (a, b) { return playCountOf(b.id) - playCountOf(a.id); });
  } else if (App.lib.sort === '재생 적은 순') {
    out.sort(function (a, b) { return playCountOf(a.id) - playCountOf(b.id); });
  }
  return out;
}

function counts() {
  var c = { '전체': 0, '영어': 0, '한글': 0, '수학': 0, '다큐': 0, '기타': 0 };
  allSongs().forEach(function (s) {
    c['전체']++;
    SUBJECTS.forEach(function (sub) {
      if (songMatchesTopic(s, sub.key, '전체')) c[sub.key]++;
    });
  });
  return c;
}
function stagesPresent() {
  var seen = {};
  allSongs().forEach(function (s) { if (s.stage) seen[s.stage] = 1; });
  return Object.keys(seen).sort(function (a, b) {
    var x = parseFloat(String(a).replace(/[^0-9.]/g, '')), y = parseFloat(String(b).replace(/[^0-9.]/g, ''));
    if (a.indexOf('+') > -1) x += 0.5;
    if (b.indexOf('+') > -1) y += 0.5;
    if (isNaN(x)) x = 99; if (isNaN(y)) y = 99;
    return x - y;
  });
}

function tcard(s, mode, compact) {
  var badges = '';
  if (s.stage) badges += '<span class="tb stage">' + esc(s.stage) + '</span>';
  if (s.ar !== '' && s.ar !== null && s.ar !== undefined) badges += '<span class="tb ar">AR ' + esc(s.ar) + '</span>';

function bookFiltered() {
  var out = [];
  var isKid = modeOf() === 'kid';
  var bs = S.bookSettings || { ownedOnly: false, ageFilter: '전체', groupBySet: true };
  var effOwned = App.books.ownedOnly || (isKid && bs.ownedOnly);
  var effAge = (isKid && bs.ageFilter && bs.ageFilter !== '전체') ? bs.ageFilter : App.books.age;
  S.channels.forEach(function (ch) {
    if (App.books.ch !== '전체' && ch.id !== App.books.ch) return;
    ch.songs.forEach(function (s) {
      if (!isBookItem(s)) return;
      if (isKid && ch.onlySelected && !s.picked) return;
      if (effOwned && !s.owned) return;
      if (effAge && effAge !== '전체' && ageGroupOf(s) !== effAge) return;
      if (App.books.viewMode === 'series' && App.books.stage && App.books.stage !== '전체') {
        if ((s.stage || '') !== App.books.stage) return;
      }
      var ar = parseFloat(s.ar);
      var hasAr = (s.ar !== '' && s.ar !== null && !isNaN(ar));
      if (App.books.viewMode === 'ar' && App.books.ar !== '전체') {
        if (App.books.ar === '확인불가' && hasAr) return;
        if (App.books.ar === '0.1-0.5' && !(hasAr && ar <= 0.5)) return;
        if (App.books.ar === '0.6-1.0' && !(hasAr && ar > 0.5 && ar <= 1.0)) return;
        if (App.books.ar === '1.1-1.5' && !(hasAr && ar > 1.0 && ar <= 1.5)) return;
        if (App.books.ar === '1.6-2.0' && !(hasAr && ar > 1.5 && ar <= 2.0)) return;
        if (App.books.ar === '2.1+' && !(hasAr && ar > 2.0)) return;
      }
      if (App.books.q) {
        var q = App.books.q.toLowerCase();
        var hay = (s.title + ' ' + (s.author || '') + ' ' + (s.stage || '') + ' ' + (s.ar === null ? '' : s.ar) + ' ' + ((s.kw || []).join(' '))).toLowerCase();
        if (hay.indexOf(q) < 0) return;
      }
      out.push({ ch: ch, s: s });
    });
  });
  out.sort(function (a, b) {
    if (App.books.sort === 'AR 높은 순') {
      var x = parseFloat(a.s.ar), y = parseFloat(b.s.ar);
      if (isNaN(x)) x = -1; if (isNaN(y)) y = -1;
      return y - x;
    }
    var ax = parseFloat(a.s.ar), ay = parseFloat(b.s.ar);
    if (isNaN(ax)) ax = 99; if (isNaN(ay)) ay = 99;
    return ax - ay;
  });
  return out;
}

function roadSeriesById(id) {
  if (typeof BOOK_ROADMAP === 'undefined') return null;
  for (var i = 0; i < BOOK_ROADMAP.length; i++) {
    var ss = BOOK_ROADMAP[i].series || [];
    for (var j = 0; j < ss.length; j++) if (ss[j].id === id) return { lvl: BOOK_ROADMAP[i], ser: ss[j] };
  }
  return null;
}

function booksMatchingRoadSeries(ser, ownedOnly) {
  var out = [];
  if (!ser || !ser.chId) return out;
  var ch = chById(ser.chId);
  if (!ch) return out;
  var kw = (ser.kw || '').toLowerCase();
  ch.songs.forEach(function (s) {
    if (!isBookItem(s)) return;
    if (ownedOnly && !s.owned) return;
    if (kw) {
      var hay = (s.title + ' ' + (s.author || '') + ' ' + (s.stage || '') + ' ' + ((s.kw || []).join(' '))).toLowerCase();
      if (hay.indexOf(kw) < 0) return;
    }
    out.push({ ch: ch, s: s });
  });
  return out;
}

function openRoadSeriesModal(serId) {

    if (ser.chId === 'ch-ort' && !ser.kw) {
      var ortStages = [];

      serItems.forEach(function (p) {

        if (st && !seenSt[st]) { seenSt[st] = true; ortStages.push(st); }

      if (ortStages.length > 1) {

          serItems = serItems.filter(function (p) { return (p.s.stage || '') === App.books.stage; });

    }
    return h + '<div class="kgrid">' +
      serItems.map(function (pair) { return renderBookCard(pair, true); }).join('') + '</div>';
  }

  if (isSeries && curCh) {
    var sInfo = SERIES_INFO[curCh.id];
    if (sInfo && sInfo.summary) {
      h += '<div class="tipbox" style="margin-bottom:8px;font-size:12.5px;line-height:1.45"><b>' + esc(sInfo.badge) + '</b><br>' + esc(sInfo.summary) + '</div>';
    }

    var seenSt2 = {};
    curCh.songs.forEach(function (s) {

      var st = s.stage || '';
      if (st && !seenSt2[st]) { seenSt2[st] = true; stages.push(st); }
    });
    if (stages.length > 1) {
      h += '<div class="chips" style="margin-bottom:8px">' +
        '<button class="chip ' + (App.books.stage === '전체' ? 'on sky' : '') + '" data-act="books-stage" data-k="전체">전체 단계</button>' +
        stages.map(function (st) {
          return '<button class="chip ' + (App.books.stage === st ? 'on sky' : '') + '" data-act="books-stage" data-k="' + esc(st) + '">' + esc(st) + '</button>';
        }).join('') + '</div>';
    }
  } else {
    var arRanges = [
      ['전체', '전체'],
      ['0.1-0.5', '0.1~0.5'],
      ['0.6-1.0', '0.6~1.0'],
      ['1.1-1.5', '1.1~1.5'],
      ['1.6-2.0', '1.6~2.0'],
      ['2.1+', '2.1+'],
      ['확인불가', '확인불가']
    ];
    h += '<div class="chips" style="margin-bottom:8px">' +
      arRanges.map(function (r) {
        return '<button class="chip ' + (App.books.ar === r[0] ? 'on mint' : '') + '" data-act="books-ar" data-k="' + r[0] + '">' + r[1] + '</button>';
      }).join('') +
      '<button class="chip" data-act="books-sort">' + (App.books.sort === 'AR 낮은 순' ? '↑ 낮은 순' : '↓ 높은 순') + '</button>' +
      '</div>';
  }

  var items = bookFiltered();
  if (!items.length) {
    return h + '<div class="empty cute"><span class="big">📚</span>조건에 맞는 원서가 없어요.</div>';
  }
  return h + '<div class="kgrid">' + items.map(function (pair) { return renderBookCard(pair, true); }).join('') + '</div>';
}

function reviewSong() {
  var s = App.review.songId ? songById(App.review.songId) : null;
  if (s) return s;
  var first = allSongs().filter(function (x) { return x.words && x.words.length; })[0];
  if (first) { App.review.songId = first.id; App.review.idx = 0; }
  return first || null;
}

function songOptionsHtml(sel) {
  return S.channels.map(function (ch) {
    var opts = ch.songs.filter(function (s) { return s.words && s.words.length; }).map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.title) + '</option>';
    }).join('');
    if (!opts) return '';
    return '<optgroup label="' + esc(ch.name) + '">' + opts + '</optgroup>';
  }).join('');
}

var RV_TABS = [
  { key: 'lyrics', label: '가사 낱말', ico: '📖' },
  { key: 'sight', label: '사이트워드', ico: '🔤' },
  { key: 'theme', label: '주제 단어카드', ico: '🖼️' }
];

function viewReview() {
  var tab = (App.review && App.review.tab) || 'lyrics';
  var tabs = '<div class="chips" style="margin-bottom:10px">' + RV_TABS.map(function (t) {
    return '<button class="chip ' + (tab === t.key ? 'on sky' : '') + '" data-act="review-tab" data-k="' + t.key + '">' + t.ico + ' ' + t.label + '</button>';
  }).join('') + '</div>';
  if (tab === 'sight') return tabs + viewSight();
  if (tab === 'theme') return tabs + viewThemeCards();
  return tabs + viewLyricsReview();
}

function viewLyricsReview() {
  var s = reviewSong();
  if (!s) return '<div class="empty"><span class="big">⭐</span>낱말이 있는 영상이 없어요.</div>';
  var words = s.words || [];
  if (App.review.idx >= words.length) App.review.idx = 0;
  var idx = Math.max(0, App.review.idx || 0);
  var w = words[idx] || { w: '', ko: '', e: '📖' };
  var phrases = (SONG_PHRASES[s.n] || []).slice();
  words.forEach(function (x) { if (x.e === '💬' || / /.test(x.w)) phrases.push(x.w); });
  phrases = phrases.filter(function (p, i, a) { return p && a.indexOf(p) === i; });

  var html = '<div class="card" style="margin-bottom:14px">' +
    '<div class="field" style="margin-bottom:8px"><label>어떤 영상의 낱말을 볼까요?</label>' +
    '<select id="review-song">' + songOptionsHtml(s.id) + '</select></div>' +
    '<div class="pills"><span class="pill ' + subjCls(s.subject) + '">' + subjIco(s.subject) + ' ' + esc(s.subject) + '</span>' +
    (s.subtopic ? '<span class="pill">' + esc(s.subtopic) + '</span>' : '') +
    '<span class="pill">낱말 ' + words.length + '개</span>' +
    (s.prints && s.prints.length ? '<span class="pill print">🖨 프린트물</span>' : '') + '</div>' +
    '</div>';

  /* mode chips */
  html += '<div class="chips" style="margin-bottom:10px">' +
    '<button class="chip ' + (App.review.mode === 'card' ? 'on coral' : '') + '" data-act="review-mode" data-m="card">🃏 낱말 카드</button>' +
    '<button class="chip ' + (App.review.mode === 'quiz' ? 'on coral' : '') + '" data-act="review-quiz">🎧 듣기 퀴즈</button>' +
    '<button class="chip" data-act="say-song">🔊 제목 듣기</button>' +
    '</div>';

  if (App.review.mode === 'quiz') {
    html += '<div class="card center"><div style="display:flex;justify-content:center">' + mascotSVG('bob', 78) + '</div><b>듣기 퀴즈를 준비했어요</b>' +
      '<p class="tiny muted">이 영상의 낱말 ' + Math.min(5, words.length) + '개로 놀이해요.</p>' +
      '<button class="btn primary big" data-act="review-quiz">놀이 시작</button></div>';
    return html;
  }

  /* flashcard */
  html += '<div class="qcard" style="padding:22px 18px">' +
    '<div class="tiny" style="color:#A79690;font-weight:800">' + (idx + 1) + ' / ' + words.length + '</div>' +
    '<div class="qbig" style="font-size:clamp(64px,20vw,104px);margin:4px 0 6px">' + (w.e || '📖') + '</div>' +
    '<div style="font-size:clamp(26px,7.4vw,38px);font-weight:900;letter-spacing:-.5px">' + esc(w.w) + '</div>' +
    (w.ko ? '<div class="qsub" style="font-size:16px;margin-top:2px">' + esc(w.ko) + '</div>' : '<div class="qsub" style="font-size:13px">뜻을 적어 주세요</div>') +
    '<div class="qfoot">' +
    '<button class="btn sky" data-act="say-current">🔊 듣기</button>' +
    '<button class="btn ghost" data-act="review-prev">◀</button>' +
    '<button class="btn ghost" data-act="review-next">▶</button>' +
    '</div></div>';

  /* word chips */
  var kid = modeOf() === 'kid';
  html += '<div class="card" style="margin-top:14px"><div class="sectitle">낱말 목록 <span class="sub">눌러서 소리 듣기</span></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px">' + words.map(function (x, i) {
      return '<span class="chip ' + (i === idx ? 'on' : '') + '" data-act="review-pick" data-i="' + i + '" style="padding-right:' + (kid ? '14px' : '6px') + '">' +
        '<span style="font-size:16px">' + (x.e || '📖') + '</span> ' + esc(x.w) +
        (kid ? '' : '<button data-act="word-del" data-i="' + i + '" style="padding:0 4px;color:#C4523F;font-weight:900" aria-label="삭제">✕</button>') + '</span>';
    }).join('') + '</div>' +
    (kid ? '<div style="margin-top:12px"><button class="btn primary block big" data-act="review-quiz">🎧 낱말 놀이 시작</button></div>'
         : '<div style="margin-top:12px"><button class="btn sm mint" data-act="word-add">＋ 낱말 추가</button></div>') + '</div>';

  if (phrases.length) {
    html += '<div class="card" style="margin-top:14px"><div class="sectitle">표현 연습 <span class="sub">문장으로 말해 보세요</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' + phrases.map(function (p) {
        return '<button class="btn" style="justify-content:flex-start;text-align:left;white-space:normal" data-act="say-text" data-t="' + esc(p) + '" data-lang="en-US">💬 ' + esc(p) + '</button>';
      }).join('') + '</div></div>';
  }

  return html;
}

function reviewQuiz() {
  var s = reviewSong();
  if (!s) return;
  var words = (s.words || []).filter(function (w) { return w.e && w.e !== '📖' && w.e !== '💬' && !/ /.test(w.w); });
  if (words.length < 2) { toast('그림이 있는 낱말이 부족해요. 낱말을 추가해 주세요.'); return; }
  var qs = [];
  pick(words, Math.min(5, words.length)).forEach(function (w) {

      audio: { text: w.w, lang: 'en-US' }, wk: w.w,
      opts: shuffle(uniqOpts([{ lb: w.ko || w.w, em: w.e, ok: true }].concat(others)).slice(0, 3))
    });
  });
  App.review.mode = 'quiz';
  startQuiz(short(s.title, 18) + ' 낱말', qs, { review: true });
}

var RM_STATUS = [
  { key: 'todo', label: '예정', ico: '○' },
  { key: 'doing', label: '진행중', ico: '◐' },
  { key: 'done', label: '완료', ico: '●' }
];

function openRmNote(stepId) {
  var body = '<div class="field"><label>아이디어 · 메모</label>' +
    '<textarea id="rm-note-text" style="min-height:110px" placeholder="예: 병원놀이에 실제 청진기 대신 종이 막대를 써 봤어요."></textarea></div>' +
    '<p class="hint">이 단계 아래에 저장돼요. 나중에 다시 볼 수 있어요.</p>';
  openModal('엄마표 아이디어 추가', body,
    '<button class="btn ghost" data-act="close-modal">취소</button>' +
    '<button class="btn primary" id="rm-note-save">저장</button>');
  document.getElementById('rm-note-save').onclick = function () {
    var t = document.getElementById('rm-note-text').value.trim();
    if (!t) { toast('내용을 적어 주세요'); return; }
    S.rmNotes = S.rmNotes || {};
    (S.rmNotes[stepId] = S.rmNotes[stepId] || []).push(t);
    save(); closeModal(); render(); toast('아이디어를 저장했어요');
  };
}

function rmStatus(id) {
  S.roadmap = S.roadmap || {};
  return S.roadmap[id] || 'todo';
}
function rmTrackProgress(track) {
  var done = 0, doing = 0;
  track.steps.forEach(function (st) {
    var v = rmStatus(st.id);
    if (v === 'done') done++;
    else if (v === 'doing') doing++;
  });
  return { done: done, doing: doing, total: track.steps.length };
}

function viewRoadmap() {
  var key = App.rm || 'en';
  var track = ROADMAP.filter(function (t) { return t.key === key; })[0] || ROADMAP[0];
  var pr = rmTrackProgress(track);

  var html = '<div class="chips" style="margin-bottom:10px">' + ROADMAP.map(function (t) {
    return '<button class="chip ' + (t.key === key ? 'on coral' : '') + '" data-act="rm-track" data-k="' + t.key + '">' +
      t.ico + ' ' + t.name + '</button>';
  }).join('') + '</div>';

  html += '<div class="rm-head card cute">' +
    '<div class="row" style="gap:10px;align-items:flex-start">' +
    '<div style="font-size:32px">' + track.ico + '</div>' +
    '<div style="flex:1"><b style="font-size:16px">' + esc(track.name) + ' 로드맵</b>' +
    '<div class="tiny muted" style="margin-top:2px">' + esc(track.summary) + '</div></div>' +
    '<div class="tiny" style="font-weight:900;color:#3FB694">' + pr.done + '/' + pr.total + '</div></div>' +
    '<div class="areaprog" style="margin-top:10px"><i style="width:' + Math.round(pr.done / pr.total * 100) + '%"></i></div>' +
    '</div>';

  track.steps.forEach(function (st, i) {
    var stt = rmStatus(st.id);
    html += '<div class="rm-step' + (stt === 'done' ? ' done' : stt === 'doing' ? ' doing' : '') + '">' +
      '<div class="rm-num">' + (i + 1) + '</div>' +
      '<div class="rm-body">' +
      '<div class="row" style="gap:6px;flex-wrap:wrap"><b style="font-size:15.5px">' + esc(st.title) + '</b>' +
      '<span class="pill">' + esc(st.age) + '</span></div>' +
      '<div class="tiny muted" style="margin-top:3px">' + esc(st.goal) + '</div>' +
      '<div class="rm-status">' + RM_STATUS.map(function (s) {
        return '<button class="rm-st' + (stt === s.key ? ' on ' + s.key : '') + '" data-act="rm-status" data-id="' + st.id + '" data-v="' + s.key + '">' + s.ico + ' ' + s.label + '</button>';
      }).join('') + '</div>';

    if (st.books && st.books.length) {
      html += '<div class="rm-line"><span class="rm-k">📚 추천 도서</span><span class="rm-v">' + st.books.map(function (b) { return '<span class="rm-tag">' + esc(b) + '</span>'; }).join('') + '</span></div>';
    }
    if (st.activities && st.activities.length) {
      html += '<div class="rm-line"><span class="rm-k">✂️ 놀이</span><span class="rm-v">' + st.activities.map(function (b) { return '<span class="rm-tag alt">' + esc(b) + '</span>'; }).join('') + '</span></div>';
    }
    if (st.work && st.work.length) {
      html += '<div class="rm-line"><span class="rm-k">✏️ 학습지·교구</span><span class="rm-v">' + st.work.map(function (b) { return '<span class="rm-tag work">' + esc(b) + '</span>'; }).join('') + '</span></div>';
    }
    if (st.links && st.links.length) {
      html += '<div class="rm-links">' + st.links.map(function (l) {
        if (l.act === 'learn-ko-1' || /^learn-ko/.test(l.act || '')) {
          return '<button class="btn sm sky" data-act="rm-learn" data-n="' + l.act.split('-')[2] + '">' + esc(l.label) + '</button>';
        }
        return '<button class="btn sm" data-act="rm-libr" data-ch="' + l.ch + '" data-stage="' + (l.stage || '') + '">' + esc(l.label) + '</button>';
      }).join('') + '</div>';
    }
    var notes = (S.rmNotes && S.rmNotes[st.id]) ? S.rmNotes[st.id] : [];
    if (notes.length) {
      html += '<div class="rm-notes">' + notes.map(function (n, ni) {
        return '<div class="rm-note">📝 <span>' + esc(n) + '</span><button data-act="rm-note-del" data-id="' + st.id + '" data-i="' + ni + '" class="rm-note-x" aria-label="삭제">✕</button></div>';
      }).join('') + '</div>';
    }
    html += '<button class="btn sm ghost rm-addnote" data-act="rm-note-add" data-id="' + st.id + '">＋ 우리 아이 아이디어 추가</button>';
    if (st.tip) html += '<div class="rm-tip">💡 ' + esc(st.tip) + '</div>';
    html += '</div></div>';
  });

  html += '<p class="tiny muted" style="margin-top:14px">단계는 아이 속도에 맞춰 조정하세요. 완료·진행중 표시는 자동 저장돼요.</p>';
  return html;
}
